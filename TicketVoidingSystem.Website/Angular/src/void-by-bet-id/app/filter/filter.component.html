<div class="filter">
    <div class="remark">
        @for (item of remark; track item) {
        <span>
            <em class="fa fa-exclamation-circle me-1"></em>{{item}}
        </span>
        }
    </div>
    <div class="d-flex flex-sm-wrap">
        <label class="col-form-label col-form-label-sm title-input" for="trans-id">BetID(s)</label>
        <div class="content">
            <bet-ids #betIds [betIdInputCss]="{'width.px': 670}" [hideInvalid]="false" [hideWarningMove]="false"
                [hideDifferentMatch]="true" [initBetIds]="transIds" [isShowLabel]="false" (afterFocusOutBetIds)="changeFilter()" >
            </bet-ids>
            <div class="abnormal-bet-check d-flex mt-2">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="abnormalBet" [(ngModel)]="isAbnormalBet"
                        [disabled]="includeMainParlay" (change)="changeFilter(); changeAbnormalBetType()">
                    <label class="form-check-label fw-bold" for="abnormalBet">
                        Abnormal Bet
                    </label>
                </div>
                @if (isAbnormalBet) {
                <input class="form-check-input ms-3" type="radio" name="abnormalBetType" id="single" value="0"
                    [(ngModel)]="abnormalBetType">
                <label class="form-check-label ms-1" for="single">Single</label>
                <input class="form-check-input ms-2" type="radio" name="abnormalBetType" id="mainParlayChild" value="1"
                    [(ngModel)]="abnormalBetType">
                <label class="form-check-label ms-1" for="mainParlayChild">Main Parlay</label>
                }
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="mainParlay"
                    [(ngModel)]="includeMainParlay" [disabled]="isAbnormalBet" (change)="changeFilter(); changeAbnormalBetType()">
                <label class="form-check-label radio-red" for="mainParlay">
                    Include Main Parlay (Sportsbook, Virtual Sports and Bet Builder)
                </label>
            </div>
        </div>
        @if (isShowRemoveInvalid) {
        <button class="btn btn-danger btn-sm btn-remove-invalid ms-1" type="button" (click)="removeInvalidTransIds()">Remove
            Invalid</button>
        }
        @if (affectedLicensees?.length > 0) {
            <div class="affected-licensees ms-3">
               <span>Attn: system will notify affected tickets to these Licensee(s): </span><br />
               <span><strong>{{affectedLicensees}}</strong></span>
           </div>
        }
        
    </div>
    <button class="btn btn-primary btn-sm mt-1" type="button" (click)="search()">Search</button>
</div>

<tooltip [tooltip]="tooltip"></tooltip>
