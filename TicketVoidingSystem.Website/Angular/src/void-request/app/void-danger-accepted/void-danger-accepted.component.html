<div>
  <ng-container *ngIf="isLoadedBasicData">
    <div *ngFor="let item of voidMatches; let id = index" class="bg-gray match-void">
      <div class="full-width d-flex bg-gray match-void">
        <div class="index-of-match d-flex align-items-center">
          <div class="number-circle"><span><strong>{{id + 1}}</strong></span></div>
        </div>
        <div class="col-sm-3 d-flex flex-column pd-right-0 pd-left-10">
          <div class="alert alert-dark p-1 m-0 mb-1"><span>
            <span *ngIf="item.isCheckedVar" class="alert padding-2-10 text-white bg-danger">VAR</span>
            Issue Type: <strong>{{item.displayIssueTypeName}}</strong></span>
          </div>
          <div class="alert alert-dark match-info p-1 m-0 flex-grow-1">
            <span>Match Code/ID:
              <strong class="match-text">{{item.matchModel.matchCode}}/{{item.matchModel.matchId}}</strong></span><br />
            <span>Match Event: <strong class="match-text">{{item.matchModel.matchEvent}}</strong></span><br />
            <span>League: <strong class="match-text">{{item.matchModel.leagueName}}</strong></span><br />
            <span *ngIf="isWrongHdp() || isWrong1stHdp() || isWrongOu() || isWrong1stOu()" class="d-flex align-items-center">
              <input type="checkbox" id="chk-early-event-{{id}}" class="mr-1"
                [disabled]="item.isAllLiveTickets || item.voidTicketsMini?.total === 0"
                [(ngModel)]="item.isCheckedEarlyEvent"
                (change)="changeCheckBoxEarlyEvent(item)"/>
              <label class="col-form-label col-form-label-sm" for="chk-early-event-{{id}}">Early Event</label>
            </span>
          </div>
        </div>
        <div class="col-sm-6 m-0 pd-right-0 pd-left-5">
          <div class="log-info-cell alert alert-dark p-1 m-0">
            <log-info-new [logInfoDetail]="item.logInfoDetail" [issueTypeId]="requestDetail.request.issueTypeId" [isMainMatch]="item.isMainMatch" [isPoolHouseAffected]="item.isPoolHouseAffected"></log-info-new>
          </div>
        </div>
        <div class="ml-3" *ngIf="isWrongHdp() || isWrong1stHdp() || isWrongOu() || isWrong1stOu()">
          <div class="wrong-market d-flex mb-3" *ngIf="item.wrongMarket">
            <label for="wrongMarket" class="col-form-label col-form-label-sm mr-2">Wrong Market</label>
            <input name="wrongMarket" [ngModel]="item.wrongMarket" disabled
              type="text" class="wrong-market-input form-control form-control-sm"/>
          </div>
          <div class="actual-market d-flex" *ngIf="item.actualMarket">
            <label for="actualMarket" class="col-form-label col-form-label-sm mr-2">Actual Market</label>
            <input [ngModel]="item.actualMarket" name="actualMarket" disabled
              type="text" class="actual-market-input form-control form-control-sm"/>
          </div>
          <div class="hdp-value d-flex" *ngIf="item.hdpValue">
            <label for="HdpValue" class="col-form-label col-form-label-sm mr-2">HDP Value</label>
            <input [ngModel]="item.hdpValue" name="HdpValue" disabled
              type="text" class="hdp-value-input form-control form-control-sm"/>
          </div>
        </div>
        <div class="flex-grow-1">
          <div class="area-icon">
            <em [ngClass]="item.isShowTicketFull ? 'icon-show-tickets-expanded': 'icon-show-tickets'"
              (click)="onClickShowVoidTickets(item)"></em>
            <em [ngClass]="item.isShowTemplateMessage ? 'icon-show-template-message-expanded' : 'icon-show-template-message'"
              (click)="onClickShowTemplateMessage(item)"></em>
          </div>
        </div>
      </div>
      <licensee-affected-list [licenseeAffectedList]="item.licenseeAffectedList" [isDisplay]="item.isShowTicketFull"></licensee-affected-list>
      <div>
        <tickets-list class="m-0" *ngIf="item.isShowTicketFull" [model]="item.voidTicketsFull"
          [(paging)]="item.pagingVoidTickets" (pagingChange)="onPagingTicketsChange(item)" (exportExcelEvent)="exportTickets(item)"
          [isBlock]="item.isBlockBetList" (ticketsChange)="null" [issueTypeId]="requestDetail.request.issueTypeId"
          [isDisableCheckbox]="true">
        </tickets-list>
        <message-area #messageArea [isShowTemplateMessage]="item.isShowTemplateMessage" [totalVoidTickets]="item.voidTicketsMini?.total" 
          [templateValue]="item.templateValue" [issueTypeId]="requestDetail.request.issueTypeId" 
          [subIssueTypeId]="item.subIssueType.subIssueTypeId" [voidReason]="item.voidReason" [requestId]="requestDetail.request.requestId">
        </message-area>
      </div>
    </div>
    <password-area [primitiveProperty]="primitiveProperty" (clickVoidAllEvent)="onClickVoidAllMatches()"></password-area>
    <tooltip [tooltip]="tooltip"></tooltip>
  </ng-container>
</div>
<div *ngIf="primitiveProperty.isBlockUI">
  <div class="in modal-backdrop spinner-overlay"></div>
  <div class="spinner-message-container" aria-live="assertive" aria-atomic="true">
    <div class="loading-message">
      <div class="loading"></div>
    </div>
  </div>
</div>
