<div >
    <div class="bg-gray mg-10 header-info wrapper-tooltip">
        <div *ngIf="isAbnormalAccount()" class="affected-username padding-2-10 alert alert-primary">
            Username: <strong>{{usernames}}</strong>
        </div>
        <event-info *ngIf="isHasMatchInfo()" [match]="match"></event-info>
        <request-info [model]="requestDetail" [issue]="issue" [isShowGeneralInfo]="false"
            [isShowAbnormalAccountInfo]="isAbnormalAccount()" [isShowVar]="isShowVar">
        </request-info>
        <log-info *ngIf="isHasLogInfo()" [logInfoDetails]="logInfoDetails" [correctOdds]="correctOdds"
            [issueTypeId]="requestDetail.request.issueTypeId" [filterBy]="filterBy" [actualScore]="actualScore" [isPoolHouseAffected]="isPoolHouseAffected">
        </log-info>
        <filter *ngIf="isWrongScore() || isWrongOdds()" [groupBetTypes]="groupBetTypes" [match]="match"
            [allBetTypes]="allBetTypes" [getPlayerQuery]="getPlayerQuery" (search)="search($event)">
        </filter>
    </div>
    <licensee-affected-list [licenseeAffectedList]="licenseeAffectedList" [isDisplay]="isShowTicket"></licensee-affected-list>
    <div class="d-flex">
        <tickets-list *ngIf="isShowTicket" [model]="ticketsModel" [(paging)]="paging" (pagingChange)="pagingEvent()"
        (exportExcelEvent)="exportExcel()" [isBlock]="isBlockBetList" (ticketsChange)="ticketsChange()"
        [issueTypeId]="issue.issueTypeId" [isDisableCheckbox]="isReducedOver()">
        </tickets-list>
    </div>
    <div [ngClass]="{'display-block': paging.total > 0, 'display-none': paging.total <= 0}">
        <template-message *ngIf="!isArchivedTickets()" #messages [value]="templateValue" [issueTypeId]="issue.issueTypeId"
            [subIssueTypeId]="issue.subIssueTypeId" [voidFunction]="2">
        </template-message>
        <confirmation #confirmation (voidAll)="voidAll()" [isDisabledButton]="isBlockBetList"></confirmation>
    </div>
</div>

<tooltip [tooltip]="tooltip"></tooltip>
