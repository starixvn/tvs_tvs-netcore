<div class="d-flex">
  <fieldset class="confirm-delete">
    <legend>Confirmation</legend>
    <table>
      <tr>
        <td>
          <label for="username">Username</label>
        </td>
        <td>
          <input name="username" class="form-control form-control-sm" type="text" disabled value="{{primitiveProperty.userName}}" />
        </td>
        <td></td>
      </tr>
      <tr>
        <td>
          <label for="password">Password</label>
        </td>
        <td>
          <input name="password" autocomplete="new-password" type="password" class="password form-control form-control-sm"
            [(ngModel)]="primitiveProperty.userPassword" />
          </td>
          <td><span>&nbsp;&nbsp;(*)</span></td>
        </tr>
        <tr>
          <td></td>
          <td>
            <input type="button" class="btn btn-success btn-sm font-weight-bold btn-void-all-matches"
              value="Void All" [disabled]="primitiveProperty.isBlockUI" (click)="onClickVoidAllMatches()" />
            </td>
          </tr>
        </table>
      </fieldset>
      @if (primitiveProperty.errorMessage) {
        <div class="error-text error-color">
          <i class="fa fa-times-circle icon-error-message" aria-hidden="true"></i>{{primitiveProperty.errorMessage}}
        </div>
      }
    </div>
