<div [ngClass]="isShowTemplateMessage ? 'display-block' : 'display-none'">
    <ng-container *ngIf="totalVoidTickets > 0">
      <template-message #templateMessage [value]="templateValue" [issueTypeId]="issueTypeId"
        [subIssueTypeId]="subIssueTypeId" [voidFunction]="2" [id]="id">
      </template-message>
      <div class="void-reason"><void-reason #reason [voidReason]="voidReason" class=""></void-reason></div>
    </ng-container>
    <ng-container *ngIf="totalVoidTickets === 0">
      <div class="reason-area">
        <div class="gray-header">
          Message
        </div>
        <textarea class="no-data-text" rows="1" readonly>There is no data</textarea>
      </div>
      <div class="reason-area">
        <div class="gray-header">
          Reason
        </div>
        <textarea class="no-data-text" rows="1" readonly>There is no data</textarea>
      </div>
    </ng-container>
  </div>
