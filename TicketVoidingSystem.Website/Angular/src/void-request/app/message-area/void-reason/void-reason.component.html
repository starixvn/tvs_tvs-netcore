@if (voidReason) {
  <div class="reason-area">
    <div class="gray-header" (click)="enableCollapse && isCollapse = !isCollapse">
      Reason
    </div>
    @if (!isCollapse) {
      <table>
        <tr class="header-language">
          <td>
            <span class="required">&nbsp;&nbsp;*</span> <span>English (Max {{150 -
          voidReason.reasonEnglish?.length}} characters)</span>
        </td>
        <td>
          <span class="required">&nbsp;&nbsp;*</span> <span>Chinese Simplified (Max {{150 -
        voidReason.reasonChineseSimplified?.length}} characters)</span>
      </td>
    </tr>
    <tr>
      <td>
        <textarea maxlength="150" class="reason" [disabled]="disabled"
        [(ngModel)]="voidReason.reasonEnglish"></textarea>
      </td>
      <td>
        <textarea maxlength="150" class="reasonSC" [disabled]="disabled"
        [(ngModel)]="voidReason.reasonChineseSimplified"></textarea>
      </td>
    </tr>
  </table>
}
</div>
}
