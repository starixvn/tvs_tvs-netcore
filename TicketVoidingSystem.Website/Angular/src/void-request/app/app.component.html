<menu-bar></menu-bar>

<div class="title">
  Home / Manage Request / Void Request - {{requestId}}
</div>
<div class="body" [blockUi]="isBlockUI">
  <ng-container *ngIf="isValidRequest()">
    <div class="remark">
      <span *ngFor="let item of remark">
        <em class="fa fa-exclamation-circle mr-1"></em>{{item}}
      </span>
    </div>
    <void-danger-accepted *ngIf="isLikelyVoidDangerAccepted()" [requestDetail]="requestDetail"></void-danger-accepted>
    <void-other-issue *ngIf="isShowVoidOtherIssue()" [requestId]="requestId" [requestDetail]="requestDetail">
      </void-other-issue>
    <void-duplicate-tickets *ngIf="isShowVoidDuplicateTickets()" [requestDetail]="requestDetail">
      </void-duplicate-tickets>
    <void-not-participate *ngIf="isLikelyVoidNotParticipate()" [requestDetail]="requestDetail"></void-not-participate>
    <void-early-kick-off *ngIf="isLikelyVoidEarlyKickOff()" [requestDetail]="requestDetail"></void-early-kick-off>
    <void-abnormal-bet *ngIf="isShowVoidAbnormalBet()" [requestDetail]="requestDetail"></void-abnormal-bet>
    <void-wrong-market-offered *ngIf="isShowVoidWrongMarketOffered()" [requestDetail]="requestDetail"></void-wrong-market-offered>
  </ng-container>
  <div *ngIf="!isValidRequest()" class="mg-10 no-data">
    Loading...
  </div>
</div>
