<div>
  <ng-container *ngIf="primitiveProperty.isLoadedBasicData">
    <div class="bg-gray void-page-item">
      <div class="full-width d-flex bg-gray">
        <div class="index-of-match d-flex align-items-center">
          <div class="number-circle"><span><strong>1</strong></span></div>
        </div>
        <div class="col-sm-3 d-flex flex-column pd-right-0 pd-left-10">
          <div class="alert alert-dark p-1 m-0" [ngClass]="{'mb-1':voidPageItem.matchModel}"><span>
            Issue Type: <strong>{{voidPageItem.displayIssueTypeName}}</strong></span>
          </div>
          <div class="alert alert-dark match-info p-1 m-0 flex-grow-1">
            <span>Match Code/ID: <strong class="match-text">{{voidPageItem.matchModel.matchCode}}/{{voidPageItem.matchModel.matchId}}</strong></span><br />
            <span>Match Event: <strong class="match-text">{{voidPageItem.matchModel.matchEvent}}</strong></span><br />
            <span>League: <strong class="match-text">{{voidPageItem.matchModel.leagueName}}</strong></span><br />
          </div>
        </div>
        <div class="col-sm-6 m-0 pd-right-0 pd-left-5">
          <div class="log-info-cell alert alert-dark p-1 m-0">
            <span><strong>Log Info</strong></span><br />
            <log-info-ticket-count [model]="voidPageItem.logInfoDetail" [isShowCancelCashOut]="true"></log-info-ticket-count>
          </div>
        </div>
        <div class="flex-grow-1">
          <div class="area-icon">
            <em [ngClass]="voidPageItem.isShowTicketFull ? 'icon-show-tickets-expanded': 'icon-show-tickets'"
              (click)="onClickShowVoidTickets(voidPageItem)"></em>
            <em [ngClass]="voidPageItem.isShowTemplateMessage ? 'icon-show-template-message-expanded' : 'icon-show-template-message'"
              (click)="onClickShowTemplateMessage(voidPageItem)"></em>
          </div>
        </div>
      </div>
      <licensee-affected-list [licenseeAffectedList]="voidPageItem.licenseeAffectedList" [isDisplay]="voidPageItem.isShowTicketFull"></licensee-affected-list>
      <div>
        <tickets-list class="m-0" *ngIf="voidPageItem.isShowTicketFull" [model]="voidPageItem.voidTicketsFull"
          [(paging)]="voidPageItem.pagingVoidTickets" (pagingChange)="onPagingTicketsChange(voidPageItem)" (exportExcelEvent)="exportTickets(voidPageItem)"
          [isBlock]="voidPageItem.isBlockBetList" (ticketsChange)="null" [issueTypeId]="requestDetail.request.issueTypeId"
          [isDisableCheckbox]="true">
        </tickets-list>
        <message-area #messageArea [isShowTemplateMessage]="voidPageItem.isShowTemplateMessage" [totalVoidTickets]="voidPageItem.voidTicketsMini?.total" 
          [templateValue]="voidPageItem.templateValue" [issueTypeId]="requestDetail.request.issueTypeId" 
          [subIssueTypeId]="voidPageItem.subIssueType.subIssueTypeId" [voidReason]="voidPageItem.voidReason">
        </message-area>
      </div>
    </div>
    <password-area [primitiveProperty]="primitiveProperty" (clickVoidAllEvent)="onClickVoidAllMatches()"></password-area>
    <tooltip [tooltip]="tooltip"></tooltip>
  </ng-container>
</div>
<div *ngIf="primitiveProperty.isBlockUI">
  <div class="in modal-backdrop spinner-overlay"></div>
  <div class="spinner-message-container" aria-live="assertive" aria-atomic="true">
    <div class="loading-message">
      <div class="loading"></div>
    </div>
  </div>
</div>
