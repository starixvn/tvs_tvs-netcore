<div class="fitler" [blockUi]="isBlock">
  <div class="row no-gutters mb-2">
    <div class="width-170"><label class="col-form-label col-form-label-sm">Search By</label></div>
    <div class="col-4 d-flex">
      @for (item of searchBy.items; track item) {
        <div class="form-check form-check-inline">
          @if (!item.hidden) {
            <input class="form-check-input" type="radio" name="inlineRadioOptions"
              [checked]="item.value === searchBy.value" [attr.value]="item.value" id="inlineRadio-{{item.value}}"
              (change)="changeSearchBy(item.value)">
            <label class="form-check-label" for="inlineRadio-{{item.value}}">{{item.name}}</label>
          }
        </div>
      }
    </div>
  </div>
  @if (searchBy.value === '2') {
    <div class="col-auto mg-bottom-10">
      <div class="d-flex">
        <label class="col-form-label col-form-label-sm mg-right-10">Marked By</label>
        <ng-select class="marked-by-dropdown mg-right-25" [items]="markedByOptions" bindLabel="name" bindValue="value"
          [(ngModel)]="this.model.markedBy" [clearable]="false" [searchable]="false">
        </ng-select>
      </div>
    </div>
  }
  @if (searchBy.value === '0') {
    <match-id #matchId [currencies]="currencies" [groupLicenseeModel]="groupLicenseeModel"
    [(model)]="model" (blockComponent)="blockComponent($event)" (changeMatch)="changeMatch()"></match-id>
  }
  @if (searchBy.value === '1') {
    <bet-ids #betIds [betIdComponentCss]="'row col-12 col-sm-8 mb-2'"></bet-ids>
  }
  <div class="search">
    <button type="button" class="btn btn-primary btn-sm" (click)="search()">Search</button>
  </div>
</div>
