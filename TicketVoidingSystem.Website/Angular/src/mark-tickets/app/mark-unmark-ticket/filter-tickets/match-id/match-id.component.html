<div class="search-by-match">
  <div class="row no-gutters mb-2">
    <div class="width-170"><label class="col-form-label col-form-label-sm">Match ID</label></div>
    <div class="col-1">
      <input class="match-id form-control form-control-sm" type="text" numbersOnly [(ngModel)]="model.matchId"
        (blur)="blurMatchId()">
    </div>
  </div>

  <div class="row no-gutters mb-2">
    <div class="width-170"><label class="col-form-label col-form-label-sm">Trans Date (GMT +8)</label></div>
    <div class="col-auto wrapper-tooltip">
      <div class="d-flex mb-0" *ngFor="let item of rangeTimes; first as isFirst; last as isLast; index as index">
        <label class="col-form-label col-form-label-sm mr-2">From</label>
        <date-full-time-new #dateTimeComponent
          [index]="index"
          class="from-date-time{{index}} mr-2"
          [isDisabled]="false"
          [(dateTime)]="item.from">
        </date-full-time-new>
        <label class="col-form-label col-form-label-sm mr-2">To</label>
        <date-full-time-new #dateTimeComponent
          [index]="index"
          class="to-date-time{{index}} mr-2"
          [isDisabled]="false"
          [(dateTime)]="item.to">
        </date-full-time-new>
        <div *ngIf="isLast" class="add-range-time"><em class="pointer fa fa-plus-circle" (click)="addRangeTimes()"></em></div>
        <div *ngIf="!isLast" class="add-range-time"><em class="pointer fa fa-minus-circle" (click)="removeRangeTimes(index)"></em>
        </div>
      </div>
    </div>
  </div>

  <div class="row no-gutters mb-2">
    <div class="width-170"><label class="col-form-label col-form-label-sm">Currency</label></div>
    <div class="currency-filter mr-4">
      <ng-select class="currencies-id" [items]="currencies.items" [multiple]="true" bindLabel="currencyCode"
        groupBy="group" [selectableGroup]="true" [selectableGroupAsModel]="false" [closeOnSelect]="false" bindValue="id"
        [(ngModel)]="currencies.selected" placeholder="Select currency..." (change)="updateSelectedCurrency()"
        [clearable]="false" [searchable]="false">
        <ng-template ng-optgroup-tmp let-item="item" let-item$="item$" let-index="index">
          <input id="item-{{index}}" type="checkbox" [ngModel]="item$.selected" /> {{currencies.selected.length === currencies.items.length ? 'Unselect All' : 'Select All'}}
        </ng-template>
        <ng-template ng-option-tmp let-item="item" let-item$="item$" let-index="index">
          <input class="mr-1" id="item-{{index}}" type="checkbox" [ngModel]="item$.selected" />{{item.currencyCode}}
        </ng-template>
        <ng-template ng-multi-label-tmp let-items="items" let-clear="clear">
          <div class="ng-value displayed-name" *ngFor="let item of items | slice:0:4">
            {{item['currencyCode']}}
            <span class="ng-value-icon right" (click)="clear(item)" aria-hidden="true">×</span>
          </div>
          <div class="number-of-more" *ngIf="items.length > 4">
            <span class="ng-value-label">+{{items.length - 4}}</span>
          </div>
        </ng-template>
      </ng-select>
    </div>
    <div class="d-flex mr-4">
      <div class="text-right mr-2"><label class="col-form-label col-form-label-sm">Event Type</label></div>
      <div class="event-type-filter mr-2">
        <ng-select class="custom-sm" [items]="eventType.items" bindLabel="name" bindValue="value"
          [(ngModel)]="eventType.value" [clearable]="false" (change)="changeEventType()">
        </ng-select>
      </div>
      <div *ngIf="eventType.value === '1'">
        <div class="padding-2-10 d-flex align-items-center rounded width-320 live-score">
          <span class="bold">Live Score:</span>
          <label class="mg-10-20 d-flex">Home </label>
          <input class="width-40" type="text" numbersOnly maxlength="2"
            [(ngModel)]="model.liveHomeScore" />
          <label class="mg-10-20 d-flex">Away </label>
          <input class="width-40 form-control form-control-sm" type="text" numbersOnly maxlength="2"
            [(ngModel)]="model.liveAwayScore" />
        </div>
      </div>
    </div>
    <div class="control-bet">
      <div class="form-check form-check-inline"><label class="form-check-label">Bet</label></div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="bet" id="radio-all" value="All" [(ngModel)]="model.bet" />
        <label class="form-check-label" for="radio-all">
          All
        </label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="bet" id="radio-single" value="Single" [(ngModel)]="model.bet" />
        <label class="form-check-label" for="radio-single">
          Single
        </label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="bet" id="radio-parlay" value="Parlay" [(ngModel)]="model.bet" />
        <label class="form-check-label" for="radio-parlay">
          Sub Parlay
        </label>
      </div>
    </div>
  </div>

  <div class="row no-gutters">
    <licensees [groupLicensees]="groupLicensees"></licensees>
  </div>

  <group-bettypes #groupBetTypesComponent [model]="groupBetTypes" (betTypesEvent)="changeBetTypes($event)">
  </group-bettypes>
  <advanced-mode #advancedMode [matchId]="model.matchId" [allBetTypes]="allBetTypes" [getPlayerQuery]="getPlayerQuery">
  </advanced-mode>
  <tooltip [tooltip]="tooltip"></tooltip>
</div>
