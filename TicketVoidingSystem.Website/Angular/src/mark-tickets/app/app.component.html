<menu-bar></menu-bar>
<div class="title">
  Home / {{title}}
</div>

<div class="mg-10">
  <div>
    <tab-mark-ticket (changeTab)="changeTab($event)" [isExternalUrl]="isExternalUrl" 
    [dataPermission]="dataPermission"></tab-mark-ticket>
  </div>
  <div class="position-relative wrapper-tooltip">
    @if (isMarkOrUnmarkTab()) {
      <mark-unmark-ticket [currentTab]="currentTab" [isExternalUrl]="isExternalUrl"
      [dataPermission]="dataPermission"> </mark-unmark-ticket>
    }

    @if (isLogTab()) {
      <user-log></user-log>
    }

    @if (isConfirmAutoUnmarkTab()) {
      <confirm-auto-unmark></confirm-auto-unmark>
    }
  </div>
</div>
