<header-website></header-website>
<div class="title">
  {{title}}
</div>
<div class="body mg-10">
  <filter #filterComponent
    [(filterModel)]="filterModel"
    [(subTypeSelection)]="subTypeSelection"
    (addUserEvent)="showAddUserModal()"
    (searchEvent)="handleSearchEvent()"
    [permission]="permission">
  </filter>
  <user-list [(models)]="userModels" [permission]="permission"></user-list>
</div>

<add-user [(model)]="addUserModel" [subTypeSelection]="subTypeSelection"></add-user>
<block-full-ui [isBlock]="isBlockingUi"></block-full-ui>
<form id="frm-send-message" action="#">
  <label for="message">Message:</label>
  <input type="text" id="message" />
  <input type="submit" id="send" value="Send" class="send" />
</form>
