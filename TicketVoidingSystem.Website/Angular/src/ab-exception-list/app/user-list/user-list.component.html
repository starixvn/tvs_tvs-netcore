<div class="user-list" [ngClass]="permission.abWhiteListHost ? 'width-1400' : 'width-1300'">
  <div class="title-user-list" *ngIf="paging.total > 0">
    <div class="title-user-list-label">AB Exception List</div>
  </div>
  <div class="table-header">
    <table>
      <thead>
        <tr>
          <th scope="col" class="col-tb-1">
            <div>No</div>
          </th>
          <th scope="col" class="col-tb-2">
            <div>Username</div>
          </th>
          <th scope="col" class="col-tb-3">
            <div>Level</div>
          </th>
          <th scope="col" class="col-tb-4">
            <div>Site</div>
          </th>
          <th scope="col" class="col-tb-5">
            <div>Sub Type (Allow Voiding)</div>
          </th>
          <th scope="col" class="col-tb-6">
            <div>Void VIP</div>
          </th>
          <th scope="col" class="col-tb-7">
            <div>Added Date (GMT+8)</div>
          </th>
          <th scope="col" [ngClass]="permission.abWhiteListHost ? 'col-tb-8' : ''">
            <div>Added By</div>
          </th>
          <th scope="col" class="col-tb-9 col-remove" *ngIf="permission.abWhiteListHost">
            <button class="button-remove-users mr-1" (click)="removeUsers()" [disabled]="isDisabledRemoveButton()">REMOVE</button>
            <input type="checkbox" [(ngModel)]="isCheckedAll" (change)="changedCheckAll()"/>
          </th>
        </tr>
      </thead>
    </table>
  </div>
  <div class="table-content">
    <table>
      <ng-container *ngFor="let item of displayedModels; index as i">
        <tbody>
          <tr>
            <td class="col-tb-1">
              <div>{{i + 1}}</div>
            </td>
            <td class="col-tb-2 text-left">
              <div>{{item.username}}</div>
            </td>
            <td class="col-tb-3">
              <div>{{getLevel(item.level)}}</div>
            </td>
            <td class="col-tb-4">
              <div>{{item.site}}</div>
            </td>
            <td class="col-tb-5 text-left">
              <div>{{item.subTypeName}}</div>
            </td>
            <td class="col-tb-6">
              <div *ngIf="isShowCheckBoxVoidVIP(item.isAllowVoidVIP)">
                <i *ngIf="item.isAllowVoidVIP === '1'" class="fa fa-check" aria-hidden="true"></i>
              </div>
              <div *ngIf="!isShowCheckBoxVoidVIP(item.isAllowVoidVIP)">N/A</div>
            </td>
            <td class="col-tb-7">
              <div>{{item.addedDate | date:'yyyy/MM/dd hh:mm:ss a'}}</div>
            </td>
            <td [ngClass]="permission.abWhiteListHost ? 'col-tb-8' : ''">
              <div>{{item.addedBy}}</div>
            </td>
            <td class="col-tb-9" *ngIf="permission.abWhiteListHost">
              <div>
                <input type="checkbox" [(ngModel)]="item.isChecked" (change)="changedCheckItem()"/>
              </div>
            </td>            
          </tr>    
        </tbody>     
      </ng-container>
    </table>

    <table *ngIf="displayedModels.length == 0 || displayedModels == null">
      <tbody>
        <tr>
          <td class="no-data">There is no data</td>
        </tr>
      </tbody>
    </table>
  </div>
  <paging [(model)]="paging" (modelChange)="pagingEvent()"></paging>
</div>
