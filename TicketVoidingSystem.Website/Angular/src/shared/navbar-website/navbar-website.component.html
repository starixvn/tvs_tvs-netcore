<nav class="nav-tvs-expand navbar navbar-expand bg-header-tvs">
  <div class="container-fluid">
    <div class="collapse navbar-collapse" id="main_nav">
      <ul class="navbar-nav">
        <div *ngFor="let menuItem of menuItems">
          <div *ngIf="menuItem.items.length === 0">
            <li class="nav-item">
              <a class="nav-link" href="{{menuItem.validUrl}}">{{menuItem.name}}</a>
            </li>
          </div>
          <div *ngIf="menuItem.items.length > 0">
            <li class="nav-item dropdown">
              <a class="nav-link  dropdown-toggle" data-bs-toggle="dropdown">{{menuItem.name}}</a>
              <ul class="dropdown-menu">
                <li *ngFor="let item of menuItem.items; index as i">
                  <a class="dropdown-item" href="{{item.validUrl}}">{{item.name}}</a>
                </li>
              </ul>
            </li>
          </div>
        </div>
      </ul>
    </div>
  </div>
</nav>
