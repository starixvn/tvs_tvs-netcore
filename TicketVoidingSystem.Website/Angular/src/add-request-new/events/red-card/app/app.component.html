<event-base-layout #eventBaseLayout
  [issueTypeId]="issueTypeId"
  (saveRequest)="saveRequest()"
  [model]="model"
  [eventHeight]="'581px'"
  [eventContent]="eventContent"
  [othersContent]="othersContent">
</event-base-layout>

<ng-template #eventContent let-eventModel="eventModel" let-isEdit="isEdit" let-requestId="requestId"
  let-filterModel="filterModel" let-otherModel="otherModel">
  <event-red-card
    #eventRedCard
    [isEdit]="isEdit"
    [requestId]="requestId"
    [filter]="filterModel"
    [redCardModels]="eventModel"
    [others]="otherModel"
    (updateMatchId)="eventBaseLayout.updateMatchInfo($event)">
  </event-red-card>
</ng-template>

<ng-template #othersContent let-otherModel="otherModel" let-isEdit="isEdit" let-matchId="matchId" let-parentMatchId="parentMatchId">
  <others [isEdit]="isEdit"
    [(model)]="model.others"
    [matchId]="matchId"
    [parentMatchId]="parentMatchId"
    [issueTypeId]="model.filter.issueTypeId">
  </others>
</ng-template>
