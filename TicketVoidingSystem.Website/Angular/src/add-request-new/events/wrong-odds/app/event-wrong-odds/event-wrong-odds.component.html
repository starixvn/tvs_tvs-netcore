<div class="mb-3">
  <event-league #leagueEvent [isEdit]="isEdit" [matchId]="logInfoEvent.matchId" (changeEvent)="changeMatchEvent()">
  </event-league>
</div>

<filter-wrong-odds #filterWrongOdds [isEdit]="isEdit" [isDisabled]="filter.isVoided"
  [subIssueTypeId]="filter.subIssueTypeId" (changeFilterEvent)="resetLogInfoOfEvent()"
  (changeFilterEvent)="resetLogInfoOfEvent();resetPoolHouseCheckedBetTypes()"
  [filterWrongOddsModel]="logInfoEvent.filterWrongOdds">
</filter-wrong-odds>
<div class="mb-3 d-flex">
  <button [disabled]="filter.isVoided" type="submit" class="btn btn-primary btn-sm" (click)="handleSearchEvent()">
    Search
  </button>
</div>
<info-site-db-down [infoSiteDBDownModel]="primitiveProps.infoSiteDBDownModel"></info-site-db-down>
<log-info-wrong-odds [isEdit]="isEdit" [logInfo]="logInfoEvent" [filter]="filter" [requestId]="requestId"
  (searchEvent)="handleSearchEvent()" [primitiveProps]="primitiveProps">
</log-info-wrong-odds>
<confirm-add-request
  [isOpen]="confirmAddRequest.isOpen"
  [issueTypeId]="filter.issueTypeId"
  [model]="confirmAddRequest"
  [issueTypes]="issueTypes"
  [voidActions]="filter.actions"
  [selectedVoidAction]="filter.action" [selectedSubIssueType]="issueTypes.subIssueId"
  [siteDBDownInfoJson]="primitiveProps.infoSiteDBDownModel?.siteDBDownInfoJson"
  (clickOk)="onClickConfirmSaveRequest()" (clickCancel)="onClickCancelSaveRequest()">
</confirm-add-request>
