<div class="event-date-filter">
  <label class="col-form-label-sm col-form-label-sm">Event Date</label>
  <div class="d-flex">
    <date-picker [disabled]="isDisabled" [minDate]="minDate" [readonly]="true"
      [(ngModel)]="fromDate" (ngModelChange)="changeFilter()" class="me-2">
    </date-picker>
    <label class="col-form-label-sm to-time-label">To</label>
    <date-picker [disabled]="isDisabled" [minDate]="minDate" [readonly]="true" (blur)="isValidEventDate()"
      [(ngModel)]="toDate" (ngModelChange)="changeFilter()" class="me-2">
    </date-picker>
  </div>
</div>

<tooltip [tooltip]="tooltip"></tooltip>
