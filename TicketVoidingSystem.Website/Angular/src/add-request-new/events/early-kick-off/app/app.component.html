<event-base-layout #eventBaseLayout
  [issueTypeId]="issueTypeId"
  (saveRequest)="saveRequest()"
  [model]="model"
  [eventHeight]="'581px'"
  [eventContent]="eventContent"
  [othersContent]="othersContent">
</event-base-layout>

<ng-template #eventContent let-eventModel="eventModel" let-issueTypes="issueTypes" let-primitiveProperty="primitiveProperty"
  let-filterModel="filterModel" let-otherModel="otherModel">
  <event-early-kick-off #eventEarlyKickOff
                [filter]="model.filter"
                [isEdit]="primitiveProperty.isEdit"
                [issueTypes]="issueTypes"
                [requestId]="primitiveProperty.requestId"
                [userId]="primitiveProperty.userId"
                [requestedBy]="primitiveProperty.requestedBy"
                [actionIdOfFirstTimeAccess]="primitiveProperty.actionIdOfFirstTimeAccess"
                [earlyKickOffModels]="model.earlyKickOffModels"
                [others]="model.others"
                [issueTypeId]="model.filter.issueTypeId">
              </event-early-kick-off>
</ng-template>

<ng-template #othersContent let-otherModel="otherModel" let-primitiveProperty="primitiveProperty">
  <others
      [isEdit]="primitiveProperty.isEdit"
      [(model)]="model.others"
      [matchId]="primitiveProperty.matchId"
      [parentMatchId]="primitiveProperty.parentMatchId"
      [issueTypeId]="issueTypeId">
    </others>
</ng-template>
