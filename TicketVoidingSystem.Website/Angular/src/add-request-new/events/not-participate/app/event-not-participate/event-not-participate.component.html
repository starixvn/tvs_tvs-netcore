<event-league #leagueEvent [isEdit]="isEdit" [matchId]="logInfoEvent.matchId" (changeEvent)="changeMatchEvent()">
</event-league>
@if (primitivePropertyEvent.isShowFilterArea) {
<filter-not-participate #filterNotParticipate [isEdit]="isEdit" [isVoided]="filter.isVoided"
  [models]="logInfoEvent.filterNotParticipates" [originalPlayers]="originalPlayers"
  [originalBetTypes]="originalBetTypes" [matchId]="logInfoEvent.matchId" (changeFilterEvent)="resetLogInfoOfEvent()">
</filter-not-participate>
}
<div class="mb-3 mt-3 d-flex">
  <button [disabled]="filter.isVoided" type="submit" class="btn btn-primary btn-sm" (click)="clickSearch()"> Search
  </button>
</div>

<info-site-db-down [infoSiteDBDownModel]="primitivePropertyEvent.infoSiteDBDownModel">
</info-site-db-down>

<log-info-not-participate #logInfo [primitiveProps]="primitivePropertyEvent" [logInfo]="logInfoEvent" [filter]="filter">
</log-info-not-participate>
<confirm-add-request [isOpen]="confirmAddRequest.isOpen"
  [model]="confirmAddRequest"
  [issueTypes]="issueTypes"
  [voidActions]="filter.actions"
  [selectedVoidAction]="filter.action"
  [selectedSubIssueType]="issueTypes.subIssueId"
  [siteDBDownInfoJson]="primitivePropertyEvent.infoSiteDBDownModel?.siteDBDownInfoJson"
  (clickOk)="onClickConfirmSaveRequest()"
  (clickCancel)="onClickCancelSaveRequest()">
</confirm-add-request>
