<label class="col-form-label-sm">Filter</label>
<div class="filter mb-2">
  <div class="header d-flex mb-2">
    <div class="player me-2">Player</div>
    <div class="group-bet-type me-2">Bet Type</div>
  </div>
  <div class="bet-type-container">
    @for (model of models; track model; let index = $index; let isLast = $last; let isFirst = $first) {
    <div class="bet-type-item mb-2">
      <filter-not-participate-item #filterItem [isEdit]="isEdit" [model]="model" [allFilterItem]="models"
        [isVoided]="isVoided" [index]="index" [isLast]="isLast" [isFirst]="isFirst" (addItemEvent)="addBetTypeItem()"
        (changeBetTypeEvent)="changeBetTypeItem()" (removeItemEvent)="removeBetTypeItem(index)"
        [originalPlayers]="originalPlayers" [originalBetTypes]="originalBetTypes" (changeFilterEvent)="changeFilter()">
      </filter-not-participate-item>
    </div>
    }
  </div>
</div>
