<event-league #eventLeague
  [isEdit]="isEdit"
  [matchId]="logInfoEvent.matchId"
  (changeEvent)="changeMatchEvent()">
</event-league>
@if (logInfoEvent.filterWrongOfferedName) {
  <filter-wrong-offered-name #filterWrongOfferedName
    [isEdit]="isEdit"
    [filterModel]="filter"
    (changeFilterEvent)="resetLogInfo()"
    [matchModel]="logInfoEvent.matchModel"
    [model]="logInfoEvent.filterWrongOfferedName">
  </filter-wrong-offered-name>
}
<div class="mb-3 d-flex mt-1">
  <button [disabled]="filter.isVoided" type="submit" class="btn btn-primary btn-sm"
    (click)="handleSearchEvent()">
    Search
  </button>
</div>
<info-site-db-down [infoSiteDBDownModel]="primitiveProps.infoSiteDBDownModel">
</info-site-db-down>
<log-info-wrong-offered-name
  [isEdit]="isEdit"
  [logInfo]="logInfoEvent"
  [requestId]="requestId"
  [filter]="filter"
  (searchEvent)="handleSearchEvent()"
  [primitiveProps]="primitiveProps">
</log-info-wrong-offered-name>
<confirm-add-request [isOpen]="confirmAddRequest.isOpen"
  [model]="confirmAddRequest"
  [issueTypes]="issueTypes"
  [voidActions]="filter.actions"
  [selectedVoidAction]="filter.action"
  [selectedSubIssueType]="issueTypes.subIssueId"
  [siteDBDownInfoJson]="primitiveProps.infoSiteDBDownModel?.siteDBDownInfoJson"
  (clickOk)="onClickConfirmSaveRequest()"
  (clickCancel)="onClickCancelSaveRequest()">
</confirm-add-request>
