<div class="log-info" *ngIf="primitiveProps.isShowLogInfo">
  <div class="list-group">
    <div class="list-group-item list-group-item-header"
      [ngClass]="{'border-radius-header' : logInfo.isCollapse}">
      <div class="d-flex pointer p-0" (click)="!filter.isVoided && clickHeader()">
        <div class="me-1"><em class="fa" [ngClass]="{'fa-angle-up':!logInfo.isCollapse, 'fa-angle-down':logInfo.isCollapse}"></em></div>
        <div>
          <div>{{logInfo.matchModel?.name}}</div>
          <div>{{logInfo.matchModel?.leagueName}}</div>
        </div>
      </div>
    </div>
    <div class="list-group-item list-group-item-body flex-column align-items-start wrapper-tooltip" [hidden]="logInfo.isCollapse">
      <div class="log" [blockUi]="isBlock">
        <div>
          <ng-container *ngIf="isShowMessage()">
            <div class="message mb-2">
              <span *ngFor="let msg of logInfo.messageValidationLogInfo">
                <div *ngIf="!msg.isError" class="d-flex align-items-center" [ngClass]="msg.isShowPopup ? 'warning-text-shorten' : 'warning-text'"
                  (click)="msg.isShowPopup && openPopupTransIds(msg.requestId, msg.transIds)">
                  <i class="fa fa-exclamation-triangle icon-warning-message me-1" aria-hidden="true"></i>{{msg.reason}}
                </div>
              </span>
            </div>
          </ng-container>
          <div class="title-tickets-list" *ngIf="logInfo.tableTicketsModel.groups !== undefined && logInfo.tableTicketsModel.groups.length > 0">
            <div class="title-tickets-list-label">{{logInfo.titleTableTicket}}</div>
          </div>
          <tickets class="ticket-table" [model]="logInfo.tableTicketsModel" [isBlock]="isBlockBetList"></tickets>
        </div>
      </div>
      <template-message *ngIf="isShowTemplateMessage()" #templateMessage [value]="logInfo.templateValue"
        [issueTypeId]="getIssueTypeId()" [subIssueTypeId]="getSubIssueTypeId()"
        [voidFunction]="4">
      </template-message>
      <div class="mt-1">
        <void-reason #reason
          [voidReason]="logInfo.voidReason"
          [enableCollapse]="true"
          [isCollapse]="true"
          [disabled]="true">
        </void-reason>
      </div>
  </div>
</div>
