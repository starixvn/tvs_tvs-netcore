<event-base-layout #eventBaseLayout
  [issueTypeId]="issueTypeId"
  (saveRequest)="saveRequest()"
  [model]="model"
  [eventHeight]="'581px'"
  [eventContent]="eventContent"
  [othersContent]="othersContent">
</event-base-layout>

<ng-template #eventContent let-eventModel="eventModel" let-isEdit="isEdit" let-requestId="requestId"
  let-filterModel="filterModel" let-otherModel="otherModel">
  <event-ticket14
    #eventTicket14
    [isEdit]="isEdit"
    [requestId]="requestId"
    [filter]="filterModel"
    [eventTicket14Model]="eventModel"
    [others]="otherModel"
  >
  </event-ticket14>
</ng-template>

<ng-template #othersContent let-otherModel="otherModel" let-isEdit="isEdit">
  <others-abnormal-bet [isEdit]="isEdit" [model]="otherModel">
  </others-abnormal-bet>
</ng-template>
