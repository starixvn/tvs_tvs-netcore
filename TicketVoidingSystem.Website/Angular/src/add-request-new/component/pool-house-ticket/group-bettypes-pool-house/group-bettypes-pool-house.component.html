@for (model of displayGroupBetTypesModel; track model; let i = $index) {
  <div>
    @if (isShowGroupBetTypes(model)) {
      <div class="group-bettypes mb-1">
        <div class="group-bettype-body" #collapse="ngbCollapse" [(ngbCollapse)]="model.isCollapsed">
          <table>
            <thead>
              <tr>
                <th scope="col" colspan="2">
                  <div>
                    <label>
                      <input type="checkbox" class="group-bettypes-all-checkbox" [(ngModel)]="model.isChecked" [disabled]="model.isDisable"
                        (ngModelChange)="model.changeCheckedModelToGroup(); changedBetTypes()" />
                        All
                      </label>
                    </div>
                  </th>
                </tr>
              </thead>
              <tbody class="collapse">
                @for (group of model.groupBetTypes; track group) {
                  <tr>
                    @if (group.isShow) {
                      <td>
                        <div class="display-flex">
                          @for (betType of group.betTypes; track betType) {
                            <div class="bet-type">
                              <label>
                                <input type="checkbox" [(ngModel)]="betType.isChecked" [disabled]="betType.isDisable"
                    (ngModelChange)="group.changeCheckedBetTypeToGroup();
                                      model.changeCheckedGroupToModel(); changedBetTypes()" />
                                  {{betType.name}}
                                </label>
                              </div>
                            }
                          </div>
                        </td>
                      }
                    </tr>
                  }
                </tbody>
              </table>
            </div>
          </div>
        }
      </div>
    }
    <tooltip [tooltip]="tooltip"></tooltip>
