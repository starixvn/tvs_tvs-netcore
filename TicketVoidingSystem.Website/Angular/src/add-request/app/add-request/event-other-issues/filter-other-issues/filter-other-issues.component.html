<label class="col-form-label-sm">Filter</label>

<div class="filter mb-2">
  <div class="filter-time d-flex">
    <div class="me-3">
      <date-full-time-new #fromTimeComponent class="from-date-time" [isDisabled]="filterModel.isVoided"
        (ngModelChange)="changeFilter()" [(ngModel)]="model.fromDateTime">
      </date-full-time-new>
    </div>
    <div class="d-flex me-2">
      <label class="col-form-label-sm me-2">To</label>
      <date-full-time-new #toTimeComponent class="to-date-time" [isDisabled]="filterModel.isVoided" (ngModelChange)="changeFilter()"
        [(ngModel)]="model.toDateTime">
      </date-full-time-new>
    </div>
  </div>
  <div class="btn-reload">
    <button [disabled]="filterModel.isVoided" type="button" class="btn btn-default btn-sm" (click)="emitRefreshEvent()">
      <span><i class="fa fa-refresh" aria-hidden="true"></i></span>
    </button>
  </div>
</div>
<tooltip [tooltip]="tooltip"></tooltip>
