<div *ngIf="primitiveProps.isShowValidation">
  <strong>Main Event - Log Info</strong>
  <div class="log-info list-group-item flex-column align-items-start wrapper-tooltip body-log-info-main">
    <log-info-ticket-count
      [model]="logInfo.logInfoDetail"
      [betTypesCount]="logInfo.betTypeCount"
      [isShowBetTypeCount]="true"
      [isShowCancelCashOut]="true">
    </log-info-ticket-count>
    <log-info-message [messages]="logInfo.messageValidationLogInfo"></log-info-message>
  </div>
</div>
