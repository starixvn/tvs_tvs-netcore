<label class="col-form-label mt-2">Filter</label>
<div class="filter">
  <div class="mb-2">
    <label class="col-form-label col-form-label-sm">Transaction Time</label>
    <div class="mb-1" *ngFor="let model of models; index as index; last as isLast; first as isFirst">
      <filter-time-item #filterItem
        [model]="model"
        [isVoided]="isVoided"
        [isLast]="isLast"
        [isFirst]="isFirst"
        [index]="index"
        (addItemEvent)="addItem($event)"
        (removeItemEvent)="removeItem($event)"
        (changeFilterEvent)="changeFilter()">
      </filter-time-item>
    </div>
    <div class="btn-reload">
      <button [disabled]="isVoided" type="button" class="btn btn-default btn-sm" (click)="emitRefreshEvent()">
        <span><i class="fa fa-refresh" aria-hidden="true"></i></span>
      </button>
    </div>
  </div>
</div>
