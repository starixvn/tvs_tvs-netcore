<label class="col-form-label">Filter</label>

<div class="filter mb-2">
  <div class="mb-2">
    <div class="filter-time d-flex">
      <div class="mr-3">
        <date-full-time-new #fromTimeComponent
          class="from-date-time"
          [isDisabled]="isDisabled"
          (changeEvent)="changeFilter()"
          [(dateTime)]="filterWrongOddsModel.filterFromTransTime">
        </date-full-time-new>
      </div>
      <div class="d-flex mr-2">
        <label class="col-form-label mr-2">To</label>
        <date-full-time-new #toTimeComponent
          class="to-date-time"
          [isDisabled]="isDisabled"
          (changeEvent)="changeFilter()"
          [(dateTime)]="filterWrongOddsModel.filterToTransTime">
        </date-full-time-new>
      </div>
      <div class="d-flex align-items-center">
        <label class="col-form-label duration">
          (Duration:&nbsp;<span class="bold">{{getDurationTime()}}</span>)
        </label>
      </div>
    </div>
  </div>

  <div class="d-flex line-1 mb-2">
  <div class="filter-odds-type">
    <ng-select class="custom-sm" [items]="filterOddsType.items" bindLabel="name" bindValue="value" [disabled]="isDisabled"
      [(ngModel)]="filterWrongOddsModel.filterOddsType" [clearable]="false" (ngModelChange)="changeFilter()">
    </ng-select>
    <div class="input-group input-group-sm d-flex">
      <div *ngIf="filterWrongOddsModel.filterOddsType === 'value'" class="input-group input-group-sm filter-odds-type-input">
        <input type="text" [(ngModel)]="filterWrongOddsModel.oddsValue" (ngModelChange)="changeFilter();isValidMultipleOdds($event, 'filter-odds-type-input')"
        class="form-control border-radius-left-0 odds-value-input" placeholder="Ex: 0.75&1&1.25" [disabled]="isDisabled">
      </div>
      <div *ngIf="filterWrongOddsModel.filterOddsType === 'range'" class="input-group input-group-sm filter-odds-type-input">
        <input type="text" [(ngModel)]="filterWrongOddsModel.fromOdds" (ngModelChange)="changeFilter();isValidSingleOdds($event, 'from-odds')" class="form-control border-radius-left-0 from-odds" [disabled]="isDisabled">
        <div class="input-group-prepend">
          <span class="input-group-text">-</span>
        </div>
        <input type="text" [(ngModel)]="filterWrongOddsModel.toOdds" (ngModelChange)="changeFilter();isValidSingleOdds($event, 'to-odds')" class="form-control to-odds" [disabled]="isDisabled">
      </div>
    </div>
  </div>
  <div class="filter-correct-odds input-group input-group-sm d-flex mr-2">
    <div class="input-group-prepend">
      <span class="input-group-text">
        Correct Odds
      </span>
    </div>
    <div class="input-group input-group-sm div-input correct-odds-input mr-2">
      <input type="text" [(ngModel)]="filterWrongOddsModel.correctOdds" (ngModelChange)="changeFilter();isCorrectFormatMultipleDecimal($event, 'correct-odds-input')"
        class="form-control border-radius-left-0" [disabled]="isDisabled">
    </div>
    <span class="d-flex align-items-center text-nowrap">(Malay Odds)</span>
  </div>
</div>
<div class="d-flex line-2">
  <div class="filter-favorite-type" *ngIf="!isSubTypeOuOr1stOu()">
    <ng-select class="custom-sm" [items]="filterFavoriteType.items" bindLabel="name" bindValue="value" [disabled]="isDisabled"
      [(ngModel)]="filterWrongOddsModel.filterFavoriteType" [clearable]="false" (ngModelChange)="changeFilter()">
    </ng-select>
    <div class="input-group input-group-sm div-input favorite-input">
      <input type="text" [(ngModel)]="filterWrongOddsModel.favoriteValue" (ngModelChange)="changeFilter();isCorrectFormatMultipleDecimal($event, 'favorite-input')"
        class="form-control border-radius-left-0" placeholder="Ex: 0.75&1&1.25" [disabled]="isDisabled">
    </div>
  </div>
  <div class="filter-ou-type" *ngIf="isSubTypeOuOr1stOu()">
    <ng-select class="custom-sm" [items]="filterOuType.items" bindLabel="name" bindValue="value" [disabled]="isDisabled"
      [(ngModel)]="filterWrongOddsModel.filterOuType" [clearable]="false" (ngModelChange)="changeFilter()">
    </ng-select>
    <div class="input-group input-group-sm div-input ou-input">
      <input type="text" [(ngModel)]="filterWrongOddsModel.ouValue" (ngModelChange)="changeFilter();isCorrectFormatMultipleDecimal($event, 'ou-input')"
        class="form-control border-radius-left-0" placeholder="Ex: 0.75&1&1.25" [disabled]="isDisabled">
    </div>
  </div>
  <div class="filter-bet-team mr-3" *ngIf="!isSubTypeOuOr1stOu()">
    <div class="form-check mr-3">
      <input class="form-check-input" type="radio" name="radio-bet-team" id="h-team" [disabled]="isDisabled"
      [(ngModel)]="filterWrongOddsModel.betTeam" [value]="'h'" (ngModelChange)="changeFilter()">
      <label class="form-check-label" for="h-team">
        Home Team
      </label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="radio-bet-team" id="a-team"  [disabled]="isDisabled"
      [(ngModel)]="filterWrongOddsModel.betTeam" [value]="'a'" (ngModelChange)="changeFilter()">
      <label class="form-check-label" for="a-team">
        Away Team
      </label>
    </div>
  </div>
  <div class="filter-live-indicator">
    <div class="form-check mr-3">
      <input class="form-check-input" type="radio" name="radio-live-indicator" id="none-live" [disabled]="isDisabled"
      [(ngModel)]="filterWrongOddsModel.liveIndicator" [value]="0" (ngModelChange)="changeFilter()">
      <label class="form-check-label" for="none-live">
        Non-Live
      </label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="radio-live-indicator" id="live" [disabled]="isDisabled"
        [(ngModel)]="filterWrongOddsModel.liveIndicator" [value]="1" (ngModelChange)="changeFilter()">
      <label class="form-check-label" for="live">
        Live
      </label>
    </div>
  </div>
</div>
<tooltip [tooltip]="tooltip"></tooltip>
