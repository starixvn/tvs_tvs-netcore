<label class="col-form-label">Filter</label>

<div class="filter mb-2">
  <div class="mb-2">
    <div class="filter-time d-flex">
      <div class="mr-3">
        <date-full-time-new #fromTimeComponent
          class="from-date-time"
          [isDisabled]="isDisabled"
          (changeEvent)="changeFilter()"
          [(dateTime)]="filterWrongOddsModel.filterFromTransTime">
        </date-full-time-new>
      </div>
      <div class="d-flex mr-2">
        <label class="col-form-label mr-2 pl-3">To</label>
        <date-full-time-new #toTimeComponent
          class="to-date-time"
          [isDisabled]="isDisabled"
          (changeEvent)="changeFilter()"
          [(dateTime)]="filterWrongOddsModel.filterToTransTime">
        </date-full-time-new>
      </div>
      <div class="d-flex align-items-center">
        <label class="col-form-label duration">
          (Duration:&nbsp;<span class="bold">{{getDurationTime()}}</span>)
        </label>
      </div>
    </div>
  </div>

<div class="d-flex line-2 mb-2">
  <div class="filter-favorite-type" *ngIf="!isSubTypeOuOr1stOu()">
    <ng-select class="custom-sm" [items]="filterFavoriteType.items" bindLabel="name" bindValue="value" [disabled]="isDisabled"
      [(ngModel)]="filterWrongOddsModel.filterFavoriteType" [clearable]="false" (ngModelChange)="changeFilter()">
    </ng-select>
    <div class="input-group input-group-sm div-input favorite-input">
      <input type="text" [(ngModel)]="filterWrongOddsModel.favoriteValue" (ngModelChange)="changeFilter();isCorrectFormatMultipleDecimal($event, 'favorite-input')"
        class="form-control border-radius-left-0" [disabled]="isDisabled">
    </div>
  </div>
  <div class="filter-ou-type" *ngIf="isSubTypeOuOr1stOu()">
    <span class="input-group-text">Wrong OU</span>
    <div class="input-group input-group-sm div-input ou-input">
      <input type="text" [(ngModel)]="filterWrongOddsModel.wrongOU" (ngModelChange)="changeFilter();isCorrectFormatMultipleDecimal($event, 'ou-input')"
        class="form-control border-radius-left-0" [disabled]="isDisabled">
    </div>
  </div>

  <div class="filter-live-indicator filter-right">
    <div class="form-check mr-3">
      <input class="form-check-input" type="radio" name="radio-live-indicator" id="none-live" [disabled]="isDisabled"
      [(ngModel)]="filterWrongOddsModel.liveIndicator" [value]="0" (ngModelChange)="changeFilter()">
      <label class="form-check-label" for="none-live">
        Non-Live
      </label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="radio-live-indicator" id="live" [disabled]="isDisabled"
        [(ngModel)]="filterWrongOddsModel.liveIndicator" [value]="1" (ngModelChange)="changeFilter()">
      <label class="form-check-label" for="live">
        Live
      </label>
    </div>
  </div>
</div>

<div class="filter-spread input-group input-group-sm d-flex mr-2 mb-2">
  <div class="spread">
    <div class="input-correct-odds d-flex">
      <div class="input-group-prepend">
        <span class="input-group-text">Spread</span>
      </div>
      <div class="input-group-sm div-input spread-input mr-2">
        <input type="text" [(ngModel)]="filterWrongOddsModel.oddsInfo.spread" (ngModelChange)="changeFilter();changeSpread()"
          class="form-control border-radius-left-0" [disabled]="isDisabled">
      </div>
    </div>
  </div>
  <div class="allowance-rate">
    <div class="input-correct-odds d-flex">
      <div class="input-group-prepend">
        <span class="input-group-text filter-right">Allowance Rate</span>
      </div>
      <ng-select class="input-group-sm div-input mr-2" [items]="allowanceRates" bindLabel="name" bindValue="value" 
      (ngModelChange)="changeFilter();changeAllowanceRate()"
          [(ngModel)]="filterWrongOddsModel.oddsInfo.allowanceRate" [clearable]="false" [searchable]="false">
      </ng-select>
    </div>
  </div>
</div>

<div class="filter-correct-odds input-group input-group-sm d-flex mr-2">
  <div class="malay-odds">
    <span *ngIf="!isSubTypeOuOr1stOu()">Home Team (Malay Odds)</span>
    <span *ngIf="isSubTypeOuOr1stOu()">Over (Malay Odds)</span>
    <div class="input-correct-odds d-flex">
      <div class="input-group-prepend">
        <span class="input-group-text">
          Correct Odds
        </span>
      </div>
      <div class="input-group-sm div-input correct-odds-input mr-2">
        <input type="text" [(ngModel)]="filterWrongOddsModel.oddsInfo.correctOddsHomeOver" 
        (ngModelChange)="changeFilter();changeCorrectOdds()"
          class="form-control border-radius-left-0">
      </div>
    </div>
  </div>
  <div class="malay-odds filter-right">
    <span *ngIf="!isSubTypeOuOr1stOu()">Away Team</span>
    <span *ngIf="isSubTypeOuOr1stOu()">Under</span>
    <div class="input-correct-odds d-flex">
      <div class="input-group-prepend">
        <span class="input-group-text">
          Correct Odds
        </span>
      </div>
      <div class="input-group-sm div-input mr-2">
        <input type="text" [(ngModel)]="filterWrongOddsModel.oddsInfo.correctOddsAwayUnder"
          class="form-control border-radius-left-0 disabled" [disabled]="true">
      </div>
    </div>
  </div>
</div>
</div>

<tooltip [tooltip]="tooltip"></tooltip>
