<div *ngIf="model.isOpen">
  <div style="z-index: 1050" aria-hidden="true" class="modal-backdrop fade show"></div>
  <div role="dialog" class="fade modal show d-block wrapper-tooltip">
    <div role="document" class="modal-dialog-custom modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title">
            <strong>Affected Ticket</strong>
          </div>
          <button class="close" (click)="closeClick()">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body" >
          <div class="affected-bet-type-area mb-3">
            <div *ngIf="tickets.groups.length > 0">
              <div class="bet-type-count mb-2" *ngIf="model.isShowDetailBetTypeCount" >
                <div class="section-header"(click)="isShowGroupBetTypesCount = !isShowGroupBetTypesCount">
                  <strong>Affected Bet Types</strong>
                </div> 
                <div class="list-group-item item-bet-type-count" *ngIf="isShowGroupBetTypesCount">
                  <ng-container *ngFor="let group of model.groupBetTypesCount">
                    <span>{{group.name}}</span><br/>
                    <ng-container *ngFor="let item of group.items">
                      <span class="ml-3">&#x2022; {{item.name}}</span><br/>
                    </ng-container>
                  </ng-container>
                </div>
              </div>
              <div class="section-header mb-2" (click)="isShowAffectedTickets = !isShowAffectedTickets" *ngIf="!model.isShowDetailBetTypeCount">
                <strong>Affected Tickets</strong>
              </div>
              <div *ngIf="filterBetTypes && isShowAffectedTickets"> 
                <multiple-selection class="multiple-selection mb-2" [multipleSelect]="filterBetTypes" (checkedItems)="updateSelectedBetTypes($event)">
                </multiple-selection>
              </div>
              <div class="section-body" *ngIf="isShowAffectedTickets">        
                <tickets [model]="tickets" [blockUi]="blockBetList"  *ngIf="isShowAffectedTickets"></tickets>
              </div>
            </div>
          </div>

          <div class="affected-bet-type-area">
            <div *ngIf="otherTickets.groups.length > 0">
              <div class="section-header mb-2" (click)="isShowOtherTickets = !isShowOtherTickets">
                  <strong>Other Tickets</strong>
                </div>
                <div class="section-body" *ngIf="isShowOtherTickets">        
                  <tickets [model]="otherTickets" [blockUi]="blockBetList"></tickets>
                </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
