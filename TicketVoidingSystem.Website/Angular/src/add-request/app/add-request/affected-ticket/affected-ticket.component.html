<div *ngIf="model.isOpen">
  <div style="z-index: 1050" aria-hidden="true" class="modal-backdrop fade show"></div>
  <div role="dialog" class="fade modal show d-block wrapper-tooltip">
    <div role="document" class="modal-dialog-custom modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title">
            <strong>Affected Ticket</strong>
          </div>
          <button class="close" (click)="closeClick()">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="affected-bet-type-area" *ngIf="model.isShowDetailBetTypeCount">
          <div class="">
            <div class="list-group">
              <div class="list-group-item list-group-item-secondary">
                <strong>&nbsp;Affected Bet Type</strong>
                <span class="caret">
                  <span *ngIf="isShowCaretDown" class="caret-down"></span>
                </span>
                <span class="caret">
                  <span *ngIf="!isShowCaretDown" class="caret-up"></span>
                </span>   
              </div>
              <div class="list-group-item flex-column align-items-start affected-bet-type-content" >
                <div *ngFor="let group of model.groupBetTypesCount">
                  <span class="affected-bet-type-text text-right pl-2">{{group}}</span>
                </div> 
              </div> 
            </div>
          </div>       
        </div>
        <div class="modal-body">
          <tickets [model]="model.tickets"></tickets>
        </div>
      </div>
    </div>
  </div>
</div>
