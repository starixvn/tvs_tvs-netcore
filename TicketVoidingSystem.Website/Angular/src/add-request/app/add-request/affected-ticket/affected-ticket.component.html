<div *ngIf="model.isOpen">
  <div style="z-index: 1050" aria-hidden="true" class="modal-backdrop fade show"></div>
  <div role="dialog" class="fade modal show d-block wrapper-tooltip">
    <div role="document" class="modal-dialog-custom modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title">
            <strong>Affected Ticket</strong>
          </div>
          <button class="close" (click)="closeClick()">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div *ngIf="model.isShowDetailBetTypeCount">
          <div class="affected-bet-type-area">
            <div class="list-group">
              <div class="section-header" (click)="isCollapsed = !isCollapsed"
                [attr.aria-expanded]="!isCollapsed">
                <strong>Affected Bet Types</strong> 
              </div>
              <div class="section-body list-group-item" [(ngbCollapse)]="isCollapsed">
                <ng-container *ngFor="let group of model.groupBetTypesCount">
                  <span>{{group.name}}</span><br/>
                  <ng-container *ngFor="let item of group.items">
                    <span class="ml-3">&#x2022; {{item.name}}</span><br/>
                  </ng-container>
                </ng-container>
              </div> 
            </div>
          </div>
          <div class="filter-bet-Types">
            <multiple-selection class="multiple-selection" [multipleSelect]="model.filterBetTypes" (checkedItems)="updateSelectedBetTypes($event)">
            </multiple-selection>
          </div>
        </div>
        <div class="modal-body">
          <tickets [model]="model.tickets"></tickets>
        </div>
      </div>
    </div>
  </div>
</div>
