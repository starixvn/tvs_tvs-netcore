<div *ngIf="model.isOpen">
  <div style="z-index: 1050" aria-hidden="true" class="modal-backdrop fade show"></div>
  <div role="dialog" class="fade modal show d-block wrapper-tooltip">
    <div role="document" class="modal-dialog-custom modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title">
            <strong>Affected Ticket</strong>
          </div>
          <button class="close" (click)="closeClick()">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div *ngIf="model.isShowDetailBetTypeCount">
          <div class="affected-bet-type-area">
            <div class="">
              <div class="list-group">
                <div class="list-group-item list-group-item-secondary" (click)="isShowCaretDown = !isShowCaretDown">
                  Affected Bet Type
                  <span class="caret">
                    <span [ngClass]="{'caret-down': isShowCaretDown, 'caret-up': !isShowCaretDown}"></span>
                  </span>               
                </div>
                <div class="list-group-item flex-column align-items-start affected-bet-type-content" *ngIf="!isShowCaretDown">
                  <div *ngFor="let group of model.groupBetTypesCount">
                    <span class="affected-bet-type-text text-right pl-2">{{group}}</span>
                  </div> 
                </div> 
              </div>
            </div>       
          </div>
          <div class="filter-bet-Types d-flex">
            <multiple-selection class="multiple-selection" [multipleSelect]="model.filterBetTypes" (checkedItems)="updateSelectedBetTypes($event)">
            </multiple-selection>
            <div class="btn-reload">
              <button type="button" class="btn btn-default btn-sm" (click)="changeFilter()">
                <span><i class="fa fa-refresh" aria-hidden="true"></i></span>
              </button>
            </div>
          </div>
        </div>
        <div class="modal-body">
          <tickets [model]="model.tickets"></tickets>
        </div>
      </div>
    </div>
  </div>
</div>
