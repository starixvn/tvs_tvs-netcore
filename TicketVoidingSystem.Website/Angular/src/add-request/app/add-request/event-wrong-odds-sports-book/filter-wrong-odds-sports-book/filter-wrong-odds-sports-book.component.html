<label class="col-form-label">Filter</label>

<div class="filter mb-2">
  <div class="mb-2">
    <div class="filter-time d-flex">
      <div class="mr-3">
        <date-full-time-new #fromTimeComponent class="from-date-time" [isDisabled]="isVoided"
          (changeEvent)="changeFilter()" [(dateTime)]="filterWrongOddsSportsBookModel.fromDateTime">
        </date-full-time-new>
      </div>
      <div class="d-flex mr-2">
        <label class="col-form-label mr-2">To</label>
        <date-full-time-new #toTimeComponent class="to-date-time" [isDisabled]="isVoided" (changeEvent)="changeFilter()"
          [(dateTime)]="filterWrongOddsSportsBookModel.toDateTime">
        </date-full-time-new>
      </div>
    </div>
  </div>

  <div class="d-flex line-1 mb-2">
    <div class="filter-odds-type">
      <ng-select class="custom-sm" [items]="filterOddsType.items" bindLabel="name" bindValue="value"
        [disabled]="isVoided" [(ngModel)]="filterWrongOddsSportsBookModel.filterOddsType" [clearable]="false"
        (change)="changeFilter()">
      </ng-select>
      <div class="input-group input-group-sm d-flex">
        <div *ngIf="filterWrongOddsSportsBookModel.filterOddsType === 'value'"
          class="input-group input-group-sm filter-odds-type-input">
          <input type="text" [(ngModel)]="filterWrongOddsSportsBookModel.oddsValue"
            (change)="changeFilter();isValidOddsFilterByValue(filterWrongOddsSportsBookModel.oddsValue)"
            class="form-control border-radius-left-0 odds-value-input" placeholder="Ex: 0.75&1&1.25"
            [disabled]="isVoided">
        </div>
        <div *ngIf="filterWrongOddsSportsBookModel.filterOddsType === 'range'"
          class="input-group input-group-sm filter-odds-type-input">
          <input type="text" [(ngModel)]="filterWrongOddsSportsBookModel.fromOdds"
            (change)="changeFilter();isValidOddsFilterByRange(filterWrongOddsSportsBookModel.fromOdds, 'from-odds')"
            class="form-control border-radius-left-0 from-odds" [disabled]="isVoided">
          <div class="input-group-prepend">
            <span class="input-group-text">-</span>
          </div>
          <input type="text" [(ngModel)]="filterWrongOddsSportsBookModel.toOdds"
            (change)="changeFilter();isValidOddsFilterByRange(filterWrongOddsSportsBookModel.toOdds, 'to-odds')" class="form-control to-odds"
            [disabled]="isVoided">
        </div>
      </div>
    </div>
    <div class="filter-correct-odds input-group input-group-sm d-flex">
      <div class="input-group-prepend">
        <span class="input-group-text">
          Correct Odds
        </span>
      </div>
      <div class="input-group input-group-sm div-input correct-odds-input mr-2">
        <input type="text" [(ngModel)]="filterWrongOddsSportsBookModel.correctOdds"
          (change)="changeFilter();isCorrectFormatMultipleDecimal(filterWrongOddsSportsBookModel.correctOdds, 'correct-odds-input')"
          class="form-control border-radius-left-0" [disabled]="isVoided">
      </div>
      <span class="d-flex align-items-center text-nowrap">(Malay Odds)</span>
    </div>
  </div>
  <div class="d-flex line-2">
    <div class="filter-live-indicator">
      <div class="form-check mr-3">
        <input class="form-check-input" type="radio" name="radio-live-indicator" id="none-live" [disabled]="isVoided"
          [(ngModel)]="filterWrongOddsSportsBookModel.liveIndicator" [value]="0" (change)="changeFilter()">
        <label class="form-check-label" for="none-live">
          Non-Live
        </label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="radio-live-indicator" id="live" [disabled]="isVoided"
          [(ngModel)]="filterWrongOddsSportsBookModel.liveIndicator" [value]="1" (change)="changeFilter()">
        <label class="form-check-label" for="live">
          Live
        </label>
      </div>
    </div>
    <div class="btn-reload">
      <button [disabled]="isVoided" type="button" class="btn btn-default btn-sm" (click)="emitRefreshEvent()">
        <span><i class="fa fa-refresh" aria-hidden="true"></i></span>
      </button>
    </div>
  </div>
  <tooltip [tooltip]="tooltip"></tooltip>
