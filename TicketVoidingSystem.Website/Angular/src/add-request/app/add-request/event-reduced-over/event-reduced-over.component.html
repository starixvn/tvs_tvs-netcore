<event-league #leagueEvent
  [isEdit]="isEdit"
  [matchId]="logInfoEvent.matchId"
  (changeEvent)="changeMatchEvent()">
</event-league>
<filter-reduced-over #filterReducedOver
  *ngIf="primitivePropertyEvent.isShowFilterArea"
  [isEdit]="isEdit"
  [isVoided]="filter.isVoided"
  [models]="logInfoEvent.filterReducedOvers"
  [groupReducedOverBetTypes]="groupReducedOverBetTypes"
  [originalReducedOverBetTypes]="originalReducedOverBetTypes"
  [originalPlayers]="originalPlayers"
  [matchId]="logInfoEvent.matchId"
  (changeFilterEvent)="resetLogInfoOfEvent()">
</filter-reduced-over>
<div class="mb-3 mt-3 d-flex">
  <button [disabled]="filter.isVoided" type="submit" class="btn btn-primary btn-sm"
    (click)="clickSearch()">
    Search
  </button>
</div>
<log-info-reduced-over #logInfo
  [primitiveProps]="primitivePropertyEvent"
  [logInfo]="logInfoEvent">
</log-info-reduced-over>
