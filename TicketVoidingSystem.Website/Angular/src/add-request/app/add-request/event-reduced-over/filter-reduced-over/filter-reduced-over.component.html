<label class="col-form-label">Filter</label>
<div class="filter mb-2">
  <div class="header d-flex mb-2">
    <div class="bet-type mr-2">BetType</div>
    <div class="wicket-over mr-2">Wicket/Over</div>
    <div class="player mr-2">Player</div>
    <div class="runs mr-2">Runs</div>
  </div>
  <div class="bet-type-container">
    <div class="bet-type-item mb-2" *ngFor="let model of models; index as index; last as isLast; first as isFirst">
      <filter-reduced-over-item #filterItem
        [isEdit]="isEdit"
        [model]="model"
        [isVoided]="isVoided"
        [index]="index"
        [isLast]="isLast"
        [isFirst]="isFirst"
        (addItemEvent)="addBetTypeItem()"
        (removeItemEvent)="removeBetTypeItem(index)"
        [originalPlayers]="originalPlayers"
        [originalReducedOverBetTypes]="originalReducedOverBetTypes"
        (changeFilterEvent)="changeFilter()">
      </filter-reduced-over-item>
    </div>
  </div>
</div>
