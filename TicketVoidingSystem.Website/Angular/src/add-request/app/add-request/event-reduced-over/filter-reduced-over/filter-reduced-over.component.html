<label class="col-form-label-sm">Filter</label>
<div class="filter mb-2">
  <div class="header d-flex mb-2">
    <div class="bet-type me-2">Bet Type</div>
    <div class="wicket-over me-2">Wicket/Over</div>
    <div class="player me-2">Player</div>
    <div class="runs me-2">Runs</div>
  </div>
  <div class="bet-type-container">
    @for (model of models; track model; let index = $index; let isLast = $last; let isFirst = $first) {
    <div class="bet-type-item mb-2">
      <filter-reduced-over-item #filterItem [isEdit]="isEdit" [model]="model" [isVoided]="isVoided" [index]="index"
        [isLast]="isLast" [isFirst]="isFirst" (addItemEvent)="addBetTypeItem()"
        (removeItemEvent)="removeBetTypeItem(index)" [originalPlayers]="originalPlayers"
        [originalReducedOverBetTypes]="originalReducedOverBetTypes" (changeFilterEvent)="changeFilter()">
      </filter-reduced-over-item>
    </div>
    }
  </div>
</div>
