<div class="d-flex">
  <ng-select-mixture
    class="multiple-selection bet-type-dropdown{{index}} mr-2"
    [selectedItems]="model.betTypeIds"
    [isDisabled]="isVoided"
    [model]="model.betTypeNgSelectMixtureModel"
    (checkedItems)="changeFilter();updateCheckedBetTypes($event)">
  </ng-select-mixture>
  <input type="text" class="form-control form-control-sm wicket-over-input{{index}} mr-2" numbersOnly [maxLength]="3"
    [(ngModel)]="model.wicketOver"
    (ngModelChange)="changeFilter();isValidOnlyNumberWicketOver($event, 'wicket-over-input')"
    [disabled]="primitivePropertyItem.isDisabledWicketOver || isVoided">
  <ng-container>
    <multiple-selection *ngIf="!primitivePropertyItem.isDisabledPlayer"
      class="multiple-selection player-dropdown{{index}} mr-2"
      [selectedItems]="model.playerIds"
      [isDisabled]="isVoided"
      [multipleSelect]="model.playerMultipleSelection"
      (checkedItems)="changeFilter();updateCheckedPlayers($event)">
    </multiple-selection>
    <div class="invalid-field mr-2" *ngIf="primitivePropertyItem.isDisabledPlayer"></div>
  </ng-container>

  <input type="text" class="form-control form-control-sm runs-input{{index}} mr-2"
    [(ngModel)]="model.runs"
    (ngModelChange)="changeFilter();isValidSingleDecimalRuns($event, 'runs-input')"
    [disabled]="primitivePropertyItem.isDisabledRuns || isVoided">
  <div class="live-indicator{{index}} mr-2">
    <div class="form-check form-check-inline mr-2">
      <input class="form-check-input" type="checkbox" name="radio-bet-team" id="none-live{{index}}"
        [disabled]="primitivePropertyItem.isDisabledNonLive || isVoided"
        [(ngModel)]="model.nonLive" (ngModelChange)="changeFilter()">
      <label class="form-check-label" for="none-live{{index}}">
        Non-Live
      </label>
    </div>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="checkbox" name="radio-bet-team" id="live{{index}}"
        [disabled]="primitivePropertyItem.isDisabledLive || isVoided"
        [(ngModel)]="model.live" (ngModelChange)="changeFilter()">
      <label class="form-check-label" for="live{{index}}">
        Live
      </label>
    </div>
  </div>
  <div *ngIf="!(isFirst && isLast)"class="d-flex align-items-center mr-2">
    <em class="pointer fa fa-minus-circle fa-icon-remove" (click)="removeBetTypeItem(index)" [ngClass]="{'cursor-not-allowed': isVoided}"></em>
  </div>
  <div *ngIf="isLast" class="d-flex align-items-center">
    <em class="pointer fa fa-plus-circle fa-icon-add" (click)="addBetTypeItem()" [ngClass]="{'cursor-not-allowed': isVoided}"></em>
  </div>
</div>
<tooltip [tooltip]="tooltip"></tooltip>
