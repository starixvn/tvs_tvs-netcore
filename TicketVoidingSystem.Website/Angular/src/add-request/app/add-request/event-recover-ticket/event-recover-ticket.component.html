<div>
  <div class="filter-product mb-3">
    <label class="col-form-label-sm">Product</label>
    <div class="product-selection">
      <ng-select class="custom-sm" [disabled]="true" [items]="products" bindLabel="name" bindValue="value"
        [(ngModel)]="recoverTicketModel.productIds" [clearable]="false" [searchable]="false">
      </ng-select>
    </div>
  </div>
  <div class="filter-sub-parlay mb-3">
    <div class="form-check align-self-end">
      <input class="form-check-input" type="checkbox" [(ngModel)]="isSubParlay" id="isSubParlay"
        (change)="changeSubParlay()" [disabled]="filter.isVoided">
      <label class="form-check-label" for="isSubParlay">
        Sub Parlay
      </label>
    </div>
    <event-league  #leagueEvent [hidden]="!isSubParlay" [isEdit]="isEdit" (changeEvent)="changeMatchEvent()"
      [matchId]="recoverTicketModel.matchId" [isShowLeague]="false" [isShowSportType]="false">
    </event-league>
  </div>
  <label class="col-form-label-sm">Bet ID(s)</label>
  <div [blockUi]="primitiveProps.isBlockBetIds">
    <bet-ids #betIds [betIdInputCss]="{'max-width.px': 1065}" [hideInvalid]="false" [hideWarningMove]="false"
      [hideDifferentMatch]="true" [disabled]="filter.isVoided" [initBetIds]="recoverTicketModel.transIds"
      (afterFocusOutBetIds)="afterFocusOutBetIds()" [isShowLabel]="false"
      [warningMoveText]="'(*) Moved or Duplicated tickets are highlighted in ORANGE.'">
    </bet-ids>
  </div>
</div>
