<label class="col-form-label-sm mt-2">Filter</label>

<div class="filter">
  <div class="mb-2 mt-2 d-flex align-items-center">
    <span class="me-1">Transaction Time</span>
    <div class="filter-time d-flex">
      <div class="me-3">
        <date-full-time-new #fromTimeComponent class="from-date-time" [isDisabled]="isVoided"
          (changeEvent)="changeFilter()" [(dateTime)]="filterTechnicalErrorModel.fromDateTime">
        </date-full-time-new>
      </div>
      <div class="d-flex align-items-center me-2">
        <span class="me-2">To</span>
        <date-full-time-new #toTimeComponent class="to-date-time" [isDisabled]="isVoided" (changeEvent)="changeFilter()"
          [(dateTime)]="filterTechnicalErrorModel.toDateTime">
        </date-full-time-new>
      </div>
    </div>
    <div class="btn-reload">
      <button [disabled]="isVoided" type="button" class="btn btn-default btn-sm" (click)="emitRefreshEvent()">
        <span><i class="fa fa-refresh" aria-hidden="true"></i></span>
      </button>
    </div>
  </div>
</div>
<tooltip [tooltip]="tooltip"></tooltip>
