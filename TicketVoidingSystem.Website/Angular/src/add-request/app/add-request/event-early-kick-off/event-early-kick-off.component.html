<ngb-alert *ngIf='warningMessageList.length > 0' [type]='"warning"' [dismissible]="false">
    <div *ngFor="let msg of warningMessageList">
        <i class="fa fa-exclamation-triangle icon-warning-message" aria-hidden="true"></i>{{msg}}
    </div>
</ngb-alert>

<league-event #leagueEvent [isEdit]="isEdit"
    [sportType]="filter.sportType" [eventDate]="filter.eventDate"
    [(matchId)]="eventDetailModel.matchId"
    (changeEvent)="updateData()"
    [isAbnormal]="false"
    (changeMatchInfo)="changeMatchInfo($event)">
</league-event>

<div class="form-group">
    <label class="col-form-label">KO Time</label>
    <div class="d-flex" [blockUi]="isBlockKickOffTime">
        <date-time [(model)]="kickOffTime" (modelChange)="updateEventDetailModel()" [disabled]="isVoided"></date-time>
        <label>(GMT+8)</label>
    </div>
</div>

<div class="no-gutters" *ngIf="!isVoided">
    <div>
        <button type="submit" class="btn btn-primary btn-sm" (click)="search()">Search</button>
    </div>
    <div class="col-sm-8" *ngIf="isShowTicket">
        <tickets-list [(model)]="tableTicketsModel" [(paging)]="paging" (pagingChange)="pagingEvent()"
            [isBlock]="isBlockBetList">
        </tickets-list>
    </div>
</div>
