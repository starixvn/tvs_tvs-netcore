<div class="log-info">
  <div class="list-group">
    <div class="list-group-item list-group-item-header"
      [ngClass]="{'header-log-info-main': isMainMatch, 'header-log-info-child': !isMainMatch, 'border-radius-header' : logInfo.isCollapse}">
      <div class="d-flex pointer p-0" (click)="!filter.isVoided && clickHeader()">
        <div class="mr-1"><em class="fa" [ngClass]="{'fa-angle-up':!logInfo.isCollapse, 'fa-angle-down':logInfo.isCollapse}"></em></div>
        <div>
          <div>{{logInfo.eventName}}</div>
          <div>{{logInfo.leagueName}}</div>
        </div>
      </div>
      <div class="col-sm-5 p-0">
        <div class="float-right d-flex" *ngIf="!isMainMatch">
          <div class="sub-type d-flex" *ngIf="isEarlyKickOff()">
            <label class="col-form-label text-right nowrap mr-1">Sub Type:</label>
            <div class="align-items-center">
              <ng-select class="sub-type-select mr-2"
                [items]="issueTypes.selectedSubIssueTypes"
                bindLabel="subIssueTypeName"
                bindValue="subIssueTypeId"
                [(ngModel)]="logInfo.subIssueTypeId"
                [clearable]="false"
                [searchable]="false"
                [disabled]="filter.isVoided">
              </ng-select>
            </div>
          </div>
          <i class="fa-solid fa-trash-can fa-sm delete-event-icon pointer" [ngClass]="{'delete-event-icon-disabled': filter.isVoided}"
              aria-hidden="true" (click)="handleDeleteEvent(logInfo.matchId)">
            </i>
        </div>
      </div>
    </div>
    <div class="list-group-item flex-column align-items-start wrapper-tooltip" [hidden]="logInfo.isCollapse"
      [ngClass]="{'body-log-info-main': isMainMatch, 'body-log-info-child': !isMainMatch}">
      <div class="log" [blockUi]="isBlock">
        <div *ngIf="logInfo.isShowValidation">
          <ng-container *ngIf="isShowMessage()">
            <div class="message mb-2">
              <span *ngFor="let msg of logInfo.messageValidationLogInfo">
                <div *ngIf="!msg.isError" class="d-flex align-items-center" [ngClass]="msg.isShowPopup ? 'warning-text-shorten' : 'warning-text'"
                  (click)="msg.isShowPopup && openPopupTransIds(msg.requestId, msg.transIds)">
                  <i class="fa fa-exclamation-triangle icon-warning-message mr-1" aria-hidden="true"></i>{{msg.reason}}
                </div>
              </span>
            </div>
          </ng-container>
          <ng-container>
            <tickets-list [model]="logInfo.tableTicketsModel" [(paging)]="logInfo.pagingModel" (pagingChange)="pagingEvent()"
              [isBlock]="isBlockBetList">
            </tickets-list>
          </ng-container>
        </div>
      </div>
      <template-message *ngIf="!isNotShowTemplateMessage()" #templateMessage [value]="logInfo.templateValue"
        [issueTypeId]="getIssueTypeId()" [subIssueTypeId]="logInfo.subIssueTypeId"
        [voidFunction]="4">
      </template-message>
  </div>
</div>
