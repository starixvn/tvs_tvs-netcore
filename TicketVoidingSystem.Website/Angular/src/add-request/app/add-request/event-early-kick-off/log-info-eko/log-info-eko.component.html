<div class="log-info">
  <div class="list-group">
    <div class="list-group-item list-group-item-header"
      [ngClass]="{'header-log-info-main': isMainMatch, 'header-log-info-child': !isMainMatch, 'border-radius-header' : logInfo.isCollapse}">
      <div class="d-flex pointer p-0" (click)="!filter.isVoided && clickHeader()">
        <div class="me-1"><em class="fa"
            [ngClass]="{'fa-angle-up':!logInfo.isCollapse, 'fa-angle-down':logInfo.isCollapse}"></em></div>
        <div>
          <div>{{logInfo.eventName}}</div>
          <div>{{logInfo.leagueName}}</div>
        </div>
      </div>
      <div class="col-sm-5 p-0">
        @if (!isMainMatch) {
        <div class="float-end d-flex">
          <i class="fa-solid fa-trash-can fa-sm delete-event-icon pointer"
            [ngClass]="{'delete-event-icon-disabled': filter.isVoided}" aria-hidden="true"
            (click)="handleDeleteEvent(logInfo.matchId)">
          </i>
        </div>
        }
      </div>
    </div>
    <div class="list-group-item flex-column align-items-start wrapper-tooltip" [hidden]="logInfo.isCollapse"
      [ngClass]="{'body-log-info-main': isMainMatch, 'body-log-info-child': !isMainMatch}">
      <div class="log" [blockUi]="isBlock">
        @if (logInfo.isShowValidation) {
        <div>
          @if (isShowMessage()) {
          <div class="message mb-2">
            @for (msg of logInfo.messageValidationLogInfo; track msg) {
            <span>
              @if (!msg.isError) {
              <div class="d-flex align-items-center"
                [ngClass]="msg.isShowPopup ? 'warning-text-shorten' : 'warning-text'"
                (click)="msg.isShowPopup && openPopupTransIds(msg.requestId, msg.transIds)">
                <i class="fa fa-exclamation-triangle icon-warning-message me-1" aria-hidden="true"></i>{{msg.reason}}
              </div>
              }
            </span>
            }
          </div>
          }
          <ng-container>
            <tickets-list [model]="logInfo.tableTicketsModel" [isBlock]="isBlockBetList"></tickets-list>
          </ng-container>
        </div>
        }
      </div>
      @if (!isNotShowTemplateMessage()) {
      <template-message #templateMessage [value]="logInfo.templateValue" [issueTypeId]="getIssueTypeId()"
        [subIssueTypeId]="getSubIssueTypeId()" [voidFunction]="4">
      </template-message>
      }
    </div>
  </div>
