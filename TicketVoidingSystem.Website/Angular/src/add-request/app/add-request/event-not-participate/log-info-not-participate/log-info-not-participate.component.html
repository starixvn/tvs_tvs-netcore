<div *ngIf="primitiveProps.isShowValidation">
  <strong>Main Event - Log Info</strong>
  <div class="log-info">
    <div class="list-group-item flex-column align-items-start wrapper-tooltip body-log-info-main">
      <detail-not-participate [logInfoDetail]="logInfo.logInfoDetail"></detail-not-participate>
      <ng-container *ngIf="logInfo.messageValidationLogInfo?.length > 0">
        <div class="message">
          <span *ngFor="let msg of logInfo.messageValidationLogInfo">
            <div *ngIf="msg.isError" class="error-text d-flex align-items-center">
              <i class="fa fa-times-circle icon-error-message mr-1" aria-hidden="true"></i>{{msg.reason}}
            </div>
            <div *ngIf="!msg.isError" [ngClass]="msg.isShowPopup ? 'warning-text-shorten' : 'warning-text'" class="d-flex align-items-center"
              (click)="msg.isShowPopup && openPopupTransIds(msg.requestId, msg.transIds)">
              <i class="fa fa-exclamation-triangle icon-warning-message mr-1" aria-hidden="true"></i>{{msg.reason}}
            </div>
          </span>
        </div>
      </ng-container>
    </div>
  </div>
</div>
