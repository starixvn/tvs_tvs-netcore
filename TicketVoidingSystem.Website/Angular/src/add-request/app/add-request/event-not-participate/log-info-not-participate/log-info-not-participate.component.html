@if (primitiveProps.isShowValidation) {
<div>
  <label class="col-form-label-sm"><strong>Main Event - Log Info</strong></label>
  <div class="log-info">
    <div class="list-group-item flex-column align-items-start wrapper-tooltip body-log-info-main">
      <log-info-ticket-count [model]="logInfo.logInfoDetail"></log-info-ticket-count>
      @if (logInfo.messageValidationLogInfo?.length > 0) {
      <div class="message">
        @for (msg of logInfo.messageValidationLogInfo; track msg) {
        <span>
          @if (msg.isError) {
          <div class="error-text d-flex align-items-center">
            <i class="fa fa-times-circle icon-error-message me-1" aria-hidden="true"></i>{{msg.reason}}
          </div>
          }
          @if (!msg.isError) {
          <div [ngClass]="msg.isShowPopup ? 'warning-text-shorten' : 'warning-text'" class="d-flex align-items-center"
            (click)="msg.isShowPopup && openPopupTransIds(msg.requestId, msg.transIds)">
            <i class="fa fa-exclamation-triangle icon-warning-message me-1" aria-hidden="true"></i>{{msg.reason}}
          </div>
          }
        </span>
        }
      </div>
      }
    </div>
  </div>
</div>
}
