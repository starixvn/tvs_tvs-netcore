<label class="col-form-label-sm">Filter</label>

<div class="filter mb-2">
  <div class="d-flex me-4 mb-2">
    <label class="check-time me-2">
      <input type="radio" name="filter-time-type" class="me-1" [disabled]="isVoided" [(ngModel)]="filterBy" [value]="2"
        (ngModelChange)="emitAfterChangeFilterEvent()" />
      Accept Time
    </label>
    <label class="trans-time">
      <input type="radio" name="filter-time-type" class="me-1" [disabled]="isVoided" [(ngModel)]="filterBy" [value]="1"
        (ngModelChange)="emitAfterChangeFilterEvent()" />
      Trans Time
    </label>
  </div>

  <div class="d-flex flex-wrap">
    <filter-time-with-allowance #filterTimeWithAllowance [tvDetectionValue]="tvDetectionValue"
      [filterTimeWithAllowanceModel]="filterTimeWithAllowanceModel" [isEdit]="isEdit" [isDisabled]="isDisabled"
      [isUseInLogInfo]="false" (changeFilterTimeEvent)="emitAfterChangeFilterEvent()">
    </filter-time-with-allowance>
  </div>
</div>
