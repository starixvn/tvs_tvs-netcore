<div class="d-flex flex-wrap event-leage horizontal-style">
  <div class="event col-md-6 col-sm-6 col-12">
      <label class="col-form-label">Event</label>
      <div>
          <ng-select class="custom-sm match-id" [disabled]="isEdit" [items]="matches" bindLabel="name" (blur)="blurMatchSelect()"
              bindValue="matchId" [(ngModel)]="selectedMatch.matchId" [clearable]="false" (change)="onChangeMatchEvent($event)"
              (search)="onSearchMatch($event)" [notFoundText]="validationMessage" [loading]="isBlock" placeholder="Input MatchID">
                <ng-template ng-option-tmp let-item="item" class="text-red" let-index="index">
                    {{item.name}}
                </ng-template>
          </ng-select>
      </div>
  </div>

  <div class="league col-md-6 col-sm-6 col-12">        
      <label class="col-form-label">League</label>
      <div>
          <ng-select class="custom-sm" [disabled]="true" [items]="leagues" bindLabel="leagueName" bindValue="leagueId"
              [(ngModel)]="leagueId" [clearable]="false" [loading]="isBlock">
          </ng-select>
      </div>
  </div>
</div>

<tooltip [tooltip]="tooltip"></tooltip>
