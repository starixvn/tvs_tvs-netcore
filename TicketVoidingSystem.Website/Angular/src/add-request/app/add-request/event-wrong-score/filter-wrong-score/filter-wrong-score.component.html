<label class="col-form-label-sm mt-2">Filter</label>

<div class="filter">
  <div class="mb-2 mt-2">
    <div class="filter-time d-flex">
      <div class="me-3">
        <date-full-time-new #fromTimeComponent [timeClass]="getTvDetectionClass()" class="from-date-time"
          [isDisabled]="isVoided" (changeEvent)="changeFilter()" [(dateTime)]="filterWrongScoreModel.fromDateTime">
        </date-full-time-new>
      </div>
      <div class="d-flex me-2">
        <label class="col-form-label-sm me-2">To</label>
        <date-full-time-new #toTimeComponent class="to-date-time" [isDisabled]="isVoided" (changeEvent)="changeFilter()"
          [(dateTime)]="filterWrongScoreModel.toDateTime">
        </date-full-time-new>
      </div>
      <div class="d-flex align-items-center me-3">
        <label class="col-form-label-sm duration">
          (Duration:&nbsp;<span class="bold">{{getDurationTime()}}</span>)
        </label>
      </div>
      <allowance-time #allowanceTimeComponent [aaTime]="filterWrongScoreModel.aaTime"
        [paTime]="filterWrongScoreModel.paTime" [saTime]="filterWrongScoreModel.saTime" (changeModel)="changeFilter()"
        [isDisabled]="isVoided">
      </allowance-time>
    </div>
  </div>
</div>
<tooltip [tooltip]="tooltip"></tooltip>
