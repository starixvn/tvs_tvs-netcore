<div *ngIf="model.isOpenDialog">
  <div style="z-index: 1050" aria-hidden="true" class="modal-backdrop fade show"></div>
  <div role="dialog" class="fade modal show d-block wrapper-tooltip">
    <div role="document" class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header primary">
          <div class="modal-title">
            <strong>Confirm</strong>
          </div>
          <button type="button" class="close" aria-label="Close" (click)="closeClick()">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">         
          <ng-container *ngIf="model.isHasWarningSettledTicket || model.isHasWarningForWrongScore || model.isHasWarningEditTakeNoteRequest" class="mg-bottom-5">
            <div *ngIf="model.isHasWarningSettledTicket" class="text-red">The request has settled ticket(s).</div>
            <div *ngIf="model.isHasWarningEditTakeNoteRequest">Ticket(s) on request will be unmarked.</div>
            <div *ngIf="model.isHasWarningForWrongScore">There are some warnings in this request.</div>
          </ng-container>
          <div class="text-red" *ngIf="model.isEditingByAnotherUser">Please remind this request {{model.requestId}} is confirmed by {{model.requestedBy}}.</div>
          <div class="mt-2">
            <i class="fa fa-question-circle text-confirm"></i> ARE YOU SURE YOU WANT TO PROCESS WITH ABOVE INFO?
          </div>       
        </div>
        <div class="modal-footer">
          <button type="button" class="btn confirm" (click)="saveClick()">OK</button>
          <button type="button" class="btn cancel" (click)="closeClick()">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</div>
