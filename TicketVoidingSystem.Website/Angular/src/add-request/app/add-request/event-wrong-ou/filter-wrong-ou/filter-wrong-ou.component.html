<div class="mb-2">
  <div class="filter-time d-flex">
    <div class="me-3">
      <date-full-time-new #fromTimeComponent class="from-date-time" [isDisabled]="isDisabled"
        (ngModelChange)="changeFilter()" [(ngModel)]="filterWrongOuModel.filterFromTransTime">
      </date-full-time-new>
    </div>
    <div class="d-flex me-2">
      <label class="col-form-label-sm me-2">To</label>
      <date-full-time-new #toTimeComponent class="to-date-time" [isDisabled]="isDisabled" (ngModelChange)="changeFilter()"
        [(ngModel)]="filterWrongOuModel.filterToTransTime">
      </date-full-time-new>
    </div>
    <div class="d-flex align-items-center">
      <label class="col-form-label-sm duration">
        (Duration:&nbsp;<span class="bold">{{getDurationTime()}}</span>)
      </label>
    </div>
  </div>
</div>
<hdp-filter-bet-type [sportTypeId]="sportTypeId" [issueTypeId]="filter.issueTypeId"
  [filterBetType]="filterWrongOuModel.filterBetType" [isDisabled]="isDisabled" (changeEvent)="changeFilter()">
</hdp-filter-bet-type>
<div class="d-flex">
  <div class="me-2">
    <div class="d-flex">
      <div class="wrong-market me-3">
        <label class="col-form-label-sm me-2">Wrong Market</label>
        <input [(ngModel)]="filterWrongOuModel.wrongMarket" [disabled]="isDisabled" placeholder="Ex: 0.75&1&1.25"
          (change)="changeFilter();isCorrectFormatHdp(filterWrongOuModel.wrongMarket, 'wrong-market-input')" type="text"
          class="wrong-market-input form-control form-control-sm" />
      </div>
      <div class="actual-market me-2">
        <label class="col-form-label-sm me-2">Actual Market</label>
        <input [(ngModel)]="filterWrongOuModel.actualMarket" [disabled]="isDisabled" (change)="changeFilter()"
          type="text" class="actual-market-input form-control form-control-sm" />
      </div>
      <div class="d-flex radio-liveindicator">
        <label class="col-form-label-sm none-live me-2 d-flex align-items-center">
          <input class="me-1" type="radio" name="radio-liveindicator-{{matchId}}" [disabled]="isDisabled"
            [(ngModel)]="filterWrongOuModel.liveIndicator" [value]="0" (change)="changeFilter()" />
          Non-Live
        </label>
        <label class="col-form-label-sm live d-flex align-items-center">
          <input class="me-1" type="radio" name="radio-liveindicator-{{matchId}}" [disabled]="isDisabled"
            [(ngModel)]="filterWrongOuModel.liveIndicator" [value]="1" (change)="changeFilter()" />
          Live
        </label>
      </div>
    </div>
  </div>
  <div>
    @if (!isMainMatch) {
    <div class="btn-reload">
      <button [disabled]="isDisabled" type="button" class="btn btn-default btn-sm" (click)="emitRefreshEvent()">
        <span><i class="fa fa-refresh" aria-hidden="true"></i></span>
      </button>
    </div>
    }
    @if (isMainMatch) {
    <div>
      <button [disabled]="isDisabled" type="submit" class="btn btn-primary btn-sm"
        (click)="emitSearchEvent()">Search</button>
    </div>
    }
  </div>
</div>

<tooltip [tooltip]="tooltip"></tooltip>
