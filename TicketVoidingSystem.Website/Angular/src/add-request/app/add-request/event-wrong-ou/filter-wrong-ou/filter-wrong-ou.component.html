<div class="mb-2">
  <div class="filter-time d-flex">
    <div class="mr-3">
      <date-full-time-new #fromTimeComponent
        class="from-date-time"
        [isDisabled]="isDisabled"
        (changeEvent)="changeFilter()"
        [(dateTime)]="filterWrongOuModel.filterFromTransTime">
      </date-full-time-new>
    </div>
    <div class="d-flex mr-2">
      <label class="col-form-label mr-2">To</label>
      <date-full-time-new #toTimeComponent
        class="to-date-time"
        [isDisabled]="isDisabled"
        (changeEvent)="changeFilter()"
        [(dateTime)]="filterWrongOuModel.filterToTransTime">
      </date-full-time-new>
    </div>
    <div class="d-flex align-items-center">
      <label class="col-form-label duration">
        (Duration:&nbsp;<span class="bold">{{getDurationTime()}}</span>)
      </label>
    </div>
  </div>
</div>
<hdp-filter-bet-type 
  [sportTypeId]="sportTypeId"
  [issueTypeId]="filter.issueTypeId"
  [filterBetType]="filterWrongOuModel.filterBetType"
  [isDisabled]="isDisabled"
  (changeEvent)="changeFilter()">
</hdp-filter-bet-type>
<div class="d-flex">
  <div class="mr-2">
    <div class="d-flex">
      <div class="wrong-market mr-3">
        <label class="col-form-label mr-2">Wrong Market</label>
        <input [(ngModel)]="filterWrongOuModel.wrongMarket"
          [disabled]="isDisabled"
          placeholder="Ex: 0.75&1&1.25"
          (ngModelChange)="changeFilter();isCorrectFormatHdp($event, 'wrong-market-input')"
          type="text" class="wrong-market-input form-control form-control-sm"/>
      </div>
      <div class="actual-market mr-2">
        <label class="col-form-label mr-2">Actual Market</label>
        <input [(ngModel)]="filterWrongOuModel.actualMarket"
          [disabled]="isDisabled"
          (ngModelChange)="changeFilter()"
          type="text" class="actual-market-input form-control form-control-sm"/>
      </div>
      <div class="d-flex radio-liveindicator">
        <label class="col-form-label none-live mr-2 d-flex align-items-center">
          <input class="mr-1" type="radio" name="radio-liveindicator-{{matchId}}" [disabled]="isDisabled" [(ngModel)]="filterWrongOuModel.liveIndicator" [value]="0" (ngModelChange)="changeFilter()" />
          Non-Live
        </label>
        <label class="col-form-label live d-flex align-items-center">
          <input class="mr-1" type="radio" name="radio-liveindicator-{{matchId}}" [disabled]="isDisabled" [(ngModel)]="filterWrongOuModel.liveIndicator" [value]="1" (ngModelChange)="changeFilter()" />
          Live
        </label>
      </div>
    </div>
  </div>
  <div>
    <div class="btn-reload" *ngIf="!isMainMatch">
      <button [disabled]="isDisabled" type="button" class="btn btn-default btn-sm" (click)="emitRefreshEvent()">
        <span><i class="fa fa-refresh" aria-hidden="true"></i></span>
      </button>
    </div>
    <div *ngIf="isMainMatch">
      <button [disabled]="isDisabled" type="submit" class="btn btn-primary btn-sm"
      (click)="emitSearchEvent()">Search</button>
    </div>
  </div>
</div>

<tooltip [tooltip]="tooltip"></tooltip>
