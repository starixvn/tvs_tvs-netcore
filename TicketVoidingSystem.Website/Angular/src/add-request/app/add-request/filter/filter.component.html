<div class="filter">
  <div class="d-flex flex-wrap">
    <div class="filter-issue-type me-4">
      <label class="col-form-label-sm">Issue Type</label>
      <div class="input-issue-type">
        <ng-select class="custom-sm" [disabled]="isEdit" [items]="issueTypes.issueTypes" bindLabel="issueTypeName"
          bindValue="issueTypeId" [(ngModel)]="issueTypes.issueId" [clearable]="false" [searchable]="false"
          (change)="onChangeIssueType()">
        </ng-select>
      </div>
    </div>

    @if (isShowSubType()) {
    <div class="filter-sub-issue-type me-4" [style.width.px]="widthSubIssueTypeControl">
      <label class="col-form-label-sm">Sub Type</label>
      @if (!isShowButtonSelectSubType()) {
      <div class="input-sub-issue-type">
        <ng-select class="custom-sm" [items]="issueTypes.selectedSubIssueTypes" bindLabel="subIssueTypeName"
          bindValue="subIssueTypeId" [(ngModel)]="issueTypes.subIssueId" [clearable]="false" [searchable]="false"
          [disabled]="model.isVoided" (change)="updateModel(true)">
        </ng-select>
      </div>
      }
      @if (isShowButtonSelectSubType()) {
      <div>
        <button (click)="openDialog()" class="btn-select-sub-type btn btn-sm btn-secondary" id="btn-select-sub-type"
          [disabled]="model.isVoided"
          [ngClass]="{'hint-text': !issueTypes.subIssueId, 'highlight': isHighlightSubType}">
          {{getSubIssueTypeName()}}
        </button>
      </div>
      }
    </div>
    }

    <div class="filter-action me-4" [style.width.px]="widthActionControl">
      <label class="col-form-label-sm">Action</label>
      <div class="input-action">
        <ng-select class="custom-sm" [items]="model.actions" bindLabel="name" bindValue="value"
          [(ngModel)]="model.action" [clearable]="false" (change)="updateModel();changeActionWaitingToManualVoid()"
          [disabled]="isDisableActionVoid()" [searchable]="false">
        </ng-select>
      </div>
    </div>

    <div class="d-flex">
      <div class="form-check align-self-end me-4">
        <input class="form-check-input" type="checkbox" [(ngModel)]="model.isTest" id="isTest">
        <label class="form-check-label" for="isTest">
          is Test
        </label>
      </div>

      @if (isArchivedTicket()) {
      <div class="form-check align-self-end">
        <input class="form-check-input" type="checkbox" [(ngModel)]="model.isAbnormal" id="isAbnormal">
        <label class="form-check-label" for="isAbnormal">
          is Abnormal
        </label>
      </div>
      }
    </div>
  </div>
</div>
<sub-issue-type-dialog [model]="subIssueTypeDialogModel"
  (updateSubTypeEvent)="updateDataAfterClosed($event)"></sub-issue-type-dialog>
