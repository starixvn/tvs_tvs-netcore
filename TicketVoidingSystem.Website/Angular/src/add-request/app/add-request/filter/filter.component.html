<div class="filter">
  <div class="d-flex flex-wrap">
    <div class="filter-issue-type mr-4" [style.width.px]="widthIssueTypeControl">
      <label class="col-form-label">Issue Type</label>
      <div class="input-issue-type">
        <ng-select class="custom-sm"
          [disabled]="isEdit"
          [items]="issueTypes.issueTypes"
          bindLabel="issueTypeName"
          bindValue="issueTypeId"
          [(ngModel)]="issueTypes.issueId"
          [clearable]="false"
          [searchable]="false"
          (change)="onChangeIssueType()">
        </ng-select>
      </div>
    </div>
  
    <div class="filter-sub-issue-type mr-4" *ngIf="isShowSubType()"
      [style.width.px]="widthSubIssueTypeControl">
      <label class="col-form-label text-right">Sub Type</label>
      <div class="input-sub-issue-type" *ngIf="!isShowButtonSelectSubType()">
        <ng-select class="custom-sm"
          [items]="issueTypes.selectedSubIssueTypes"
          bindLabel="subIssueTypeName"
          bindValue="subIssueTypeId"
          [(ngModel)]="issueTypes.subIssueId"
          [clearable]="false"
          [searchable]="false"
          [disabled]="model.isVoided"
          (change)="updateModel(true)">
        </ng-select>
      </div>
      <div *ngIf="isShowButtonSelectSubType()">
        <button 
          (click)="openDialog()"
          class="btn-select-sub-type btn btn-sm btn-secondary"
          id="btn-select-sub-type"
          [disabled]="model.isVoided"
          [ngClass]="{'hint-text': !issueTypes.subIssueId, 'highlight': isHighlightSubType}">
          {{getSubIssueTypeName()}}
        </button>
      </div>
    </div>
  
    <div class="filter-action mr-4" [style.width.px]="widthActionControl">
      <label class="col-form-label">Action</label>
      <div class="input-action">
        <ng-select class="custom-sm"
          [items]="actions"
          bindLabel="name"
          bindValue="value"
          [(ngModel)]="model.action"
          [clearable]="false"
          (change)="updateModel();changeActionWaitingToManualVoid()"
          [disabled]="isDisableActionVoid()"
          [searchable]="false">
        </ng-select>
      </div>
    </div>
  
    <div class="d-flex">      
      <div class="d-flex align-items-end">
        <div class="form-check form-check-inline form-control-sm checkbox-test">
          <input class="form-check-input"
            type="checkbox"
            name="checkbox-test"
            [(ngModel)]="model.isTest"
            aria-label="Checkbox for following text input"
            id="chk-is-test"
            class="mr-1">
          <label class="form-check-label" for="chk-is-test">is Test</label>
        </div>
      </div>

      <div *ngIf="isArchivedTicket()" class="d-flex align-items-end">
        <div class="form-check form-check-inline form-control-sm checkbox-abnormal">
          <input class="form-check-input"
            type="checkbox"
            name="checkbox-abnormal"
            [(ngModel)]="model.isAbnormal"
            aria-label="Checkbox for following text input"
            id="chk-is-abnormal"
            class="mr-1"
            [disabled]="model.isVoided">
          <label class="form-check-label" for="chk-is-abnormal">is Abnormal</label>
        </div>
      </div>
    </div>
  </div>
</div>
<sub-issue-type-dialog [model]="subIssueTypeDialogModel" (updateSubTypeEvent)="updateDataAfterClosed($event)" ></sub-issue-type-dialog>
