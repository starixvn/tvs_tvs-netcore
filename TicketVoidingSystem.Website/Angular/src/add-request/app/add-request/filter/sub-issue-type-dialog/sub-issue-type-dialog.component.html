<div *ngIf="model.isOpen">
  <div style="z-index: 1050" aria-hidden="true" class="modal-backdrop fade show"></div>
  <div role="dialog" class="fade modal show d-block wrapper-tooltip">
    <div role="document" class="modal-dialog-custom modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title">
            <strong>Sub Type List</strong>
          </div>
          <button class="close" (click)="onClose()">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="check-all-area" *ngIf="isDangerAccepted()">
            <input type="checkbox" id="view-all-option" class="mr-1" [(ngModel)]="isCheckedViewAllOptions" />
            <label class="col-form-label" for="view-all-option"> View all options</label>
          </div>
          <div class="check-type-wrong-score" *ngIf="isWrongScore()">
            <div>
              <label class="no-onwards">
                <input class="mr-1" type="radio" 
                  name="type-of-wrong-score"
                  [value]="false"
                  (change)="onChangeTypeOfWrongScore()"
                  [(ngModel)]="isCheckedWrongScoreOnwards"/>
                No Onwards (void 1 score)
              </label>
            </div>
            <div>
              <label class="onwards">
                <input class="mr-1" type="radio"
                  name="type-of-wrong-score"
                  [value]="true"
                  (change)="onChangeTypeOfWrongScore()"
                  [(ngModel)]="isCheckedWrongScoreOnwards"/>
                Onwards (void > 1 score)
              </label>
            </div>
          </div>
          <div class="modal-body-container">
            <div class="select-sub-type-body">            
              <div class="header-select-sub-type">
                <div class="col-tb-3 col-header">No.</div>
                <div class="col-tb-30 col-header">Sub Type</div>
                <div class="col-tb-18 col-header">Selection</div>
                <div class="col-tb-3 col-header">AA</div>
                <div class="col-tb-3 col-header">PA</div>
                <div class="col-tb-3 col-header">SA</div>
                <div class="col-tb-40 col-header">Description</div>
              </div>
              <div class="container-select-sub-type">
                <div class="main-match" *ngFor="let item of subIssueTypes; ">
                  <div class="cell-ct-collapse align-items-start pointer" *ngIf="item.isShowCategoryName"
                    (click)="item.isCollapse = !item.isCollapse">
                    <em class="fa fa-icon-collapse"
                      [ngClass]="{'fa-angle-up':!item.isCollapse, 'fa-angle-down':item.isCollapse}"></em>
                    &nbsp;<span>{{item.categoryName}}</span>
                  </div>
                  <div class="issue-group" [hidden]="item.isCollapse">
                    <div class="issue-item" *ngFor="let group of item.groups; index as index">
                      <div class="col-tb-3 col-ct">{{index + 1}}</div>
                      <div class="col-tb-30 col-ct d-flex col-ct-sub-type-name">
                        <span [innerHtml]="group.name"></span>
                        <span class="spacer"></span>
                        <div class="group-sub-issue-image" [ngClass]="group.iconClass" *ngIf="group.iconClass"></div>
                      </div>
                      <div class="col-tb-18">
                        <div *ngIf="isHaveButton(group.buttonSelectHomeAway)" class="d-flex"
                          [ngClass]="checkCanShowButtonSelectAll(group.buttonSelectAll) ? 'height-50' : 'height-100'">
                          <div class="col-tb-50 col-ct" *ngFor="let button of group.buttonSelectHomeAway">
                            <button type="button" class="btn btn-sub-type"
                              (click)="onSelectSubIssueType(group, button.subIssueTypeId)"
                              [ngClass]="button.btnClass">
                              {{button.name}}
                            </button>
                          </div>
                        </div>
                        <div *ngIf="checkCanShowButtonSelectAll(group.buttonSelectAll)" class="height-100">
                          <div *ngFor="let button of group.buttonSelectAll" class="col-ct"
                            [ngClass]="isHaveButton(group.buttonSelectHomeAway) ? 'height-50' : 'height-100'">
                            <button type="button" class="btn btn-sub-type"
                              (click)="onSelectSubIssueType(group, button.subIssueTypeId)"
                              [ngClass]="button.btnClass">
                              {{button.name}}
                            </button>
                          </div>
                        </div>
                      </div>
                      <div class="col-tb-3 col-ct col-ct-aa-time"><span *ngIf="group.aa">+</span>{{group.aa}}</div>
                      <div class="col-tb-3 col-ct col-ct-pa-time"><span *ngIf="group.aa">+</span>{{group.pa}}</div>
                      <div class="col-tb-3 col-ct col-ct-sa-time"><span *ngIf="group.aa">+</span>{{group.sa}}</div>
                      <div class="col-tb-40 col-ct col-ct-description">
                        <div *ngFor="let desc of group.description">
                          <div [innerHTML]="desc"></div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
