<div class="account-list">
  <div class="title-account-list">
    <div class="title-account-list-label"></div>
    <div class="title-account-list-toolbox">
      <input type="button" class="title-account-list-toolbox-excel" title="Export to Excel" (click)="exportExcel()">
    </div>
  </div>
  <div class="table-header">
    <table>
      <thead>
        <tr>
          <th scope="col" class="col-tb-1">
            <div>No</div>
          </th>
          <th scope="col" class="col-tb-2">
            <div class="title-table">
              <span>Username</span>
              <sorting #sortingComponent [id]="1" (sortEvent)="sorting($event, 'username', 1)"></sorting>
            </div>
          </th>
          <th scope="col" class="col-tb-3">
            <div class="title-table">
              <span>Given Credit</span>
              <sorting #sortingComponent [id]="2" (sortEvent)="sorting($event, 'givenCredit', 2)"></sorting>
            </div>
          </th>
          <th scope="col" class="col-tb-4">
            <div class="title-table">
              <span>Adjust Void Limit</span>
              <sorting #sortingComponent [id]="3" (sortEvent)="sorting($event, 'adjustVoidLimit', 3)"></sorting>
            </div>
          </th>
          <th scope="col" class="col-tb-5">
            <div class="title-table">
              <span>Current Winning</span>
              <sorting #sortingComponent [id]="4" (sortEvent)="sorting($event, 'currentWinning', 4)"></sorting>
            </div>
          </th>
          <th scope="col" class="col-tb-6">
            <div class="title-table">
              <span>Current Losing</span>
              <sorting #sortingComponent [id]="5" (sortEvent)="sorting($event, 'currentLosing', 5)"></sorting>
            </div>
          </th>
          <th scope="col" class="col-tb-7">
            <div class="title-table">
              <span>Estimate Void Amount</span>
              <sorting #sortingComponent [id]="6" (sortEvent)="sorting($event, 'estimateVoidAmount', 6)"></sorting>
            </div>
          </th>
          <th scope="col">
            <div class="title-table">
              <span>WinLost After Void</span>
              <sorting #sortingComponent [id]="7" (sortEvent)="sorting($event, 'winLostAfterVoid', 7)"></sorting>
            </div>
          </th>
        </tr>
      </thead>
    </table>
  </div>
  <div class="table-content">
    <table>
      <ng-container *ngFor="let item of accountWinlostModels; index as i">
        <tbody>
          <tr [ngClass]="item.isHighlight ? 'bg-yellow' : ''">
            <td class="col-tb-1">
              <div>{{i + 1}}</div>
            </td>
            <td class="col-tb-2 text-left">
              <div>{{item.username}}</div>
            </td>
            <td class="col-tb-3 text-right">
              <div>{{item.givenCredit}}</div>
            </td>
            <td class="col-tb-4 text-right adjust-gv">
              <input class="form-control form-control-sm" type="number" [(ngModel)]="item.adjustVoidLimit"
                (blur)="reCalculate(item)" />
            </td>
            <td class="col-tb-5 text-right">
              <div>{{item.currentWinning}}</div>
            </td>
            <td class="col-tb-6 text-right">
              <div>{{item.currentLosing}}</div>
            </td>
            <td class="col-tb-7 text-right">
              <div>{{item.estimateVoidAmount}}</div>
            </td>
            <td class="text-right">
              <div>{{item.winLostAfterVoid}}</div>
            </td>
          </tr>
        </tbody>
      </ng-container>
    </table>

    <table *ngIf="accountWinlostModels == null || accountWinlostModels.length == 0">
      <tbody>
        <tr>
          <td class="no-data">There is no data</td>
        </tr>
      </tbody>
    </table>
  </div>
  <!-- <paging [(model)]="paging" (modelChange)="pagingEvent()"></paging> -->
</div>
