<ngb-alert class="warning-msg" type="warning" [dismissible]="false" *ngIf="primitiveProps.isShowError">
  <div class="message">
    <div class="error-text" *ngIf="primitiveProps.isInvalidTotalTicket">
      <i class="fa fa-times-circle icon-error-message" aria-hidden="true"></i>
      There is no ticket in this request
    </div>
    <div class="error-text" *ngIf="primitiveProps.isBeingMoveBetDate">
      <i class="fa fa-times-circle icon-error-message" aria-hidden="true"></i>
      The system is running the Movebet process, please wait and try again.
    </div>
  </div>
</ngb-alert>

<div [blockUi]="primitiveProps.isBlockUsernames">
  <user-names #usernames [(model)]="abnormalAccountModel.usernames" [disabled]="isVoided" [maxUsername]="2050"
    (change)="changeFilter()" (focusOutUsernames)="focusOutUsernames()" [inputUsernameCss]="'col-sm-8'"
    [inputUsernameStyle]="{'max-width.px': 1065}">
  </user-names>
</div>

<product-filter #products [abnormalAccountModel]="abnormalAccountModel" [isDisabled]="isVoided" [isEdit]="isEdit"
  (changeFilterEvent)="changeFilter()" [actionId]="filter.action"></product-filter>
<event-date-filter #eventDate [abnormalAccountModel]="abnormalAccountModel" [isDisabled]="isVoided" [isEdit]="isEdit"
  (changeFilterEvent)="changeFilter()" [minDate]="primitiveProps.minDate"></event-date-filter>

<div *ngIf="isShowUserInfo()" class="mt-3">
  <div class="mb-3">
    <button [disabled]="filter.isVoided" type="submit" class="btn btn-primary btn-sm"
      (click)="handleSearchEvent()" (mousedown)="$event.preventDefault()">Search</button><br/>
  </div>
  <div *ngIf="isShowButtonAdjustEstimatedVoid()" class="mb-1">
    <button [disabled]="filter.isVoided" type="submit" class="btn btn-success btn-sm"
    (click)="openAccountAffectedTicket()">Adjust Estimated Void Amount</button>
  </div>
  <account-table #accountTable
    *ngIf="primitiveProps.isShowAccountWinLost"
    [filter]="filter"
    [requestId]="requestId"
    (changeTable)="hideValidationMessage()"
    [abnormalAccountModel]="abnormalAccountModel"
    [accountWinlostModels]="primitiveProps.validAccountWinlostModels"
    [permission]="primitiveProps.permission">
  </account-table>
</div>
<account-affected-ticket
  *ngIf="accountAffectedTicketModel.isOpen"
  [(tickets)]="abnormalAccountModel.adjustedTickets"
  [model]="accountAffectedTicketModel">
</account-affected-ticket>

<confirm-add-request
  [model]="confirmAddRequest"
  [issueTypes]="issueTypes"
  [voidActions]="filter.actions"
  [selectedVoidAction]="filter.action"
  [selectedSubIssueType]="issueTypes.subIssueId"
  (clickOk)="onClickConfirmSaveRequest()"
  (clickCancel)="onClickCancelSaveRequest()">
</confirm-add-request>
