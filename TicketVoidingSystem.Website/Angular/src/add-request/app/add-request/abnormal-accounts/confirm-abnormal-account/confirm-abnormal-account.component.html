<div *ngIf="model.isOpenDialog">
  <div style="z-index: 1050" aria-hidden="true" class="modal-backdrop fade show"></div>
  <div role="dialog" class="fade modal show d-block wrapper-tooltip">
    <div role="document" class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header primary">
          <div class="modal-title">
            <strong>Confirm</strong>
          </div>
          <button type="button" class="close" aria-label="Close" (click)="closeClick()">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <ng-container *ngIf="model.isHasWarningTicketsExistedInRequest">
            <div>There are some tickets ({{model.numberOfTicketsExistedInRequest}}) that existed in other Requests.</div>
          </ng-container>
          <ng-container *ngIf="model.isHasWarningEditTakeNoteRequest">
            <div>Take note or removed ticket(s) will be unmarked</div>
          </ng-container>
          <div class="text-red" *ngIf="model.isEditingByAnotherUser">Please remind this request {{model.requestId}} is
            confirmed by {{model.requestedBy}}.</div>
          <div class="mg-top-10"><i class="fa fa-question-circle text-confirm"></i> ARE YOU SURE YOU WANT TO
            PROCESS WITH ABOVE INFO?</div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn confirm" (click)="saveClick()">OK</button>
          <button type="button" class="btn cancel" (click)="closeClick()">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</div>
