<div>
  <div style="z-index: 1050" aria-hidden="true" class="modal-backdrop fade show"></div>
  <div role="dialog" class="fade modal show d-block wrapper-tooltip">
    <div role="document" class="modal-dialog-custom modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title">
            <strong>Affected Ticket</strong>
          </div>
          <button class="close" (click)="closeClick()">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body" [blockUi]="isBlock">
          <div class="filter-user-name mr-4">
            <label class="col-form-label">Username</label>
            <ng-select class="custom-sm"
                [items]="model.usernames"
                bindLabel="name"
                bindValue="value"
                [(ngModel)]="model.selectedCustId"
                [clearable]="false"
                [searchable]="false"
                (change)="onChangeUsername()">
              </ng-select>
          </div>
          <account-table #accountTable
            [viewOnly]="true"
            [accountWinlostModels]="[accountWinlostTable]">
          </account-table>
          <!-- <tickets [model]="section.tickets" [isBlock]="blockBetList"></tickets> -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary btn-sm" (click)="saveClick()">Save</button>
          <button type="button" class="btn btn-danger btn-sm" (click)="closeClick()">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</div>
