<div class="row text-right event-date-filter">
    <label class="col-sm-1 col-form-label">Event Date</label>
    <div class="col-sm-7 d-flex">
        <div class="input-group">
            <input class="from-date form-control form-control-sm {{isDisabled ? '' : 'bg-white'}}" name="ngbFromDate"
                [(ngModel)]="fromDate" placeholder="yyyy-mm-dd" ngbDatepicker #fd="ngbDatepicker" (click)="fd.toggle()"
                [minDate]="minDate" [readOnly]="true" [disabled]="isDisabled"/>
            <div class="input-group-append pointer">
                <span class="input-group-text" (click)="fd.toggle()"><em class="fa fa-calendar"></em></span>
            </div>
        </div>
        <label class="col-form-label to-time-label">To</label>
        <div class="input-group">
            <input class="to-date form-control form-control-sm {{isDisabled ? '' : 'bg-white'}}" name="ngbToDate"
                [(ngModel)]="toDate" placeholder="yyyy-mm-dd" ngbDatepicker #td="ngbDatepicker"
                (click)="td.toggle()" [disabled]="isDisabled" (blur)="isValidEventDate()" />
            <div class="input-group-append pointer">
                <span class="input-group-text" (click)="td.toggle()"><em class="fa fa-calendar"></em></span>
            </div>
        </div>
    </div>
</div>

<tooltip [tooltip]="tooltip"></tooltip>
