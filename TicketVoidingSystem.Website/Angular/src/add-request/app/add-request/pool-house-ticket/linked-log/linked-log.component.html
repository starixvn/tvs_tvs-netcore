<div class="container">
  <div *ngIf="linkedLogsViewModel.result?.isSuccessful">
    <label><strong>Linked Log</strong></label>
    <div class="d-flex flex-wrap">
      <ng-container *ngFor="let linkLog of linkedLogsViewModel.groupLinkedLogs">
        <div class="link-logs mr-3">
          <div class="link-logs-header">
            <table>
              <thead>
                <tr>
                  <th scope="col" colspan="2">
                    <div *ngIf="linkLog.isAffectedGroup" class="affected-log"> {{linkLog.groupName}} - Affected</div>
                    <div *ngIf="!linkLog.isAffectedGroup"> {{linkLog.groupName}} - Not Affected</div>
                  </th>
                </tr>
              </thead>
            </table>
          </div>
          <div class="link-logs-content" *ngIf="linkLog.logsData?.length > 0">
            <table>
              <tbody>
                <tr *ngFor="let logsData of linkLog.logsData">
                  <td>
                    <div>
                      {{logsData}}
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="link-logs-content-no-data" *ngIf="!linkLog.logsData || linkLog.logsData.length === 0">
            <table>
              <tbody>
                <tr>
                  <td class="no-data d-flex justify-content-center">There is no data</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </ng-container>
    </div>
  </div>

  <div *ngIf="!linkedLogsViewModel.result?.isSuccessful" class="warning-text d-flex align-items-center mb-2">
    <i class="fa fa-exclamation-triangle icon-warning-message mr-1"
      aria-hidden="true"></i>{{linkedLogsViewModel.result?.errorMsg}}
  </div>
</div>
