<div [blockUi]="primitiveProps.isBlockBetIds">
  <div class="d-flex mb-2 header-bet-id" [ngStyle]="{'max-width.px': 1065}">
    <div class="mr-4">Bet ID(s)</div>
    <div class="form-check form-check-inline" *ngFor="let item of abnormalFilterBy.items">
      <input class="form-check-input" type="radio" name="inlineRadioOptions" [attr.value]="item.value"
        [checked]="item.value === duplicateTicketsModel.filterBy" id="inlineRadio-{{item.value}}"
        (change)="changeFilterBy(item.value)" [disabled]="filter.isVoided || isEdit"/>
      <label *ngIf="!item.hidden" class="form-check-label" for="inlineRadio-{{item.value}}">{{item.name}}</label>
    </div>
    <div class="flex-grow-1"></div>
    <button type="submit" class="btn btn-danger btn-sm" *ngIf="primitiveProps.isShowButtonRemoveInvalid" (click)="removeInvalidTransIds()">Remove Invalid</button>
  </div>

  <bet-ids #betIds [leftBetIdCss]="'col-form-label'" [rightBetIdCss]="'col-sm-8'"
    [betIdInputCss]="{'max-width.px': 1065}" [hideInvalid]="false" [hideWarningMove]="false"
    [hideDifferentMatch]="false" [disabled]="filter.isVoided" [initBetIds]="duplicateTicketsModel.transIds"
    (afterFocusOutBetIds)="afterFocusOutBetIds()"
    [isShowLabel]="false"
    [warningMoveText]="'(*) Moved or Duplicated tickets are highlighted in ORANGE.'">
  </bet-ids>
</div>

<league-event-abnormal *ngIf="isShowLeagueEvent()" #leagueEventAbnormal [isEdit]="isEdit" [initSportType]="filter.sportType"
  [eventDate]="filter.eventDate" [initMatchId]="duplicateTicketsModel.matchId" [actionId]="filter.action">
</league-event-abnormal>
