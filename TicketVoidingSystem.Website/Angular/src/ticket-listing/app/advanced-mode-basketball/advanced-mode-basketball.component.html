<div class="advanced-mode" *ngIf="isShow">
  <fieldset [ngClass]="{'fieldset-collapse': !isShowContent}">
    <legend title="Collapse advanced mode" (click)="isShowContent = !isShowContent">
      <em [ngClass]="{'icon-minus-sign': isShowContent, 'icon-plus-sign': !isShowContent}"></em>Advanced mode
    </legend>
    <div [hidden]="!isShowContent">
      <div class="content">
        <div>
          <label class="advanced-mode-basketball">
            {{filterName}}
            <multiple-select class="multiple-selection" [multipleSelect]="selection"
              [isDisabled]="isDisabled"></multiple-select>
          </label>
        </div>
      </div>
    </div>
  </fieldset>
</div>
<tooltip [tooltip]="tooltip"></tooltip>
