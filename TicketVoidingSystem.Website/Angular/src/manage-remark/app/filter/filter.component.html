<div class="filter bg-gray min-width-1666">
  <div class="d-flex mg-left-0 mg-bottom-10">
    <div class=""><span>Search by</span></div>
    <div class="">
      <label class="form-check-label">
        <input type="radio" class="form-check-input" name="search-by" value="0" [(ngModel)]="model.searchBy"
          (change)="changeSearchBy()" /> MatchId
      </label>
      <label class="form-check-label">
        <input type="radio" class="form-check-input" name="search-by" value="1" [(ngModel)]="model.searchBy"
          (change)="changeSearchBy()" /> RemarkId
      </label>
    </div>
  </div>
  <div class="row">
    @if (isFilterByMatch()) {
    <div class="d-flex flex-wrap filter-by-match">
      <div class="d-flex me-3">
        <label class="col-form-label col-form-label-sm me-2">Match Id</label>
        <input maxlength="10" class="form-control form-control-sm input-match-id" type="text" only-number
          [(ngModel)]="model.matchId" (ngModelChange)="updateModel()" (keyup.enter)="clickSearch()">
      </div>
      <div class="d-flex me-3">
        <label class="col-form-label col-form-label-sm me-2">From Date</label>
        <div class="select-date">
          <div class="input-group">
            <input class="form-control form-control-sm bg-white" placeholder="yyyy-mm-dd" name="ngbFromDate"
              [(ngModel)]="model.ngbFromDate" (ngModelChange)="updateModel()" ngbDatepicker #ngbFromDate="ngbDatepicker"
              (click)="ngbFromDate.toggle()" [minDate]="minDate" [maxDate]="model.ngbToDate" [readOnly]="true">
            <div class="input-group-append pointer">
              <span class="input-group-text" (click)="ngbFromDate.toggle()"><em class="fa fa-calendar"></em></span>
            </div>
          </div>
        </div>
      </div>
      <div class="d-flex me-3">
        <label class="col-form-label col-form-label-sm me-2">To Date</label>
        <div class="select-date">
          <div class="input-group">
            <input class="form-control form-control-sm bg-white" placeholder="yyyy-mm-dd" name="ngbToDate"
              [(ngModel)]="model.ngbToDate" (ngModelChange)="updateModel()" ngbDatepicker #ngbToDate="ngbDatepicker"
              (click)="ngbToDate.toggle()" [minDate]="model.ngbFromDate" [readOnly]="true">
            <div class="input-group-append pointer">
              <span class="input-group-text" (click)="ngbToDate.toggle()"><em class="fa fa-calendar"></em></span>
            </div>
          </div>
        </div>
      </div>
      <div class="d-flex me-3">
        <label class="col-form-label col-form-label-sm me-2">Action</label>
        <multiple-selection class="multiple-selection action" [multipleSelect]="model.actionSelectList"
        (checkedItems)="updateSelectedAction($event)">
        </multiple-selection>
      </div>
      <div class="d-flex me-3">
        <label class="col-form-label col-form-label-sm me-2">Created By</label>
        <ng-select [items]="model.createdBySelectList" bindLabel="name" bindValue="value" [(ngModel)]="model.createdBy"
          [clearable]="false">
        </ng-select>
      </div>
      <div class="d-flex align-items-center">
        <label class="col-form-label col-form-label-sm me-2">
          <input class="checkbox-exclude-test" type="checkbox" [(ngModel)]="model.isExcludeTest" />Exclude test data
        </label>
      </div>
    </div>
    }
    @if (!isFilterByMatch()) {
    <div class="d-flex flex-wrap filter-by-remark">
      <div class="d-flex me-3">
        <label class="col-form-label col-form-label-sm me-2">Remark Id</label>
        <input maxlength="10" class="form-control form-control-sm remark-id" type="text" only-number
          [(ngModel)]="model.remarkId" (ngModelChange)="updateModel()" (keyup.enter)="clickSearch()">
      </div>
    </div>
    }

  </div>
  <div class="mg-top-10 d-flex">
    <button type=" submit" class="btn btn-primary btn-sm me-3" (click)="clickSearch()">Search</button>
    <button type="submit" class="btn btn-success btn-sm me-3" (click)="newRemark()">New Remark</button>
  </div>
</div>
<tooltip [tooltip]="tooltip"></tooltip>
