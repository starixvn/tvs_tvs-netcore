<div class="void-history">
  <div class="container-area d-flex flex-wrap">
    <div class="col-sm-3">
      <div class="d-flex">
        <label class="col-form-label">MatchId: </label>
        <input type="text" maxlength="150" class="input-control form-control form-control-sm"
          [(ngModel)]="tmpModel.matchId" disabled />
      </div>
    </div>
    <div class="col-sm-3">
      <div class="d-flex" [ngClass]="{'blur-content' : isRecoverTicket}">
        <label class="col-form-label">MessageId</label>
        <input type="text" maxlength="150" class="input-control form-control form-control-sm"
          [(ngModel)]="tmpModel.messageId" numbersOnly [disabled]="isRecoverTicket"/>
      </div>
    </div>
    <div class="col-sm-3">
      <div class="d-flex" [ngClass]="{'blur-content' : isRecoverTicket}">
        <label class="col-form-label">MessageIdSpecial</label>
        <input type="text" maxlength="150" class="input-control form-control form-control-sm"
          [(ngModel)]="tmpModel.messageIdSpecial" numbersOnly [disabled]="isRecoverTicket"/>
      </div>
    </div>
    <div class="col-sm-3">
      <div class="d-flex" [ngClass]="{'blur-content' : isRecoverTicket}">
        <label class="col-form-label">ReasonId</label>
        <input type="text" maxlength="150" class="input-control form-control form-control-sm"
          [(ngModel)]="tmpModel.reasonId" numbersOnly [disabled]="isRecoverTicket"/>
      </div>
    </div>
    <div class="col-sm-3">
      <div class="d-flex" [ngClass]="{'blur-content' : isRecoverTicket}">
        <label class="col-form-label">IsSentBatchMessage</label>
        <select [(ngModel)]="tmpModel.isSentBatchMessage" [disabled]="isRecoverTicket">
          <option *ngFor="let item of selectionItem" [ngValue]="item.value">{{item.name}}</option>
        </select>
      </div>
    </div>
    <div class="col-sm-3">
      <div class="d-flex" [ngClass]="{'blur-content' : isRecoverTicket || isAbnormalBet}">
        <label class="col-form-label">IsSentMessageToAdminSite</label>
        <select [(ngModel)]="tmpModel.isSentMessageToAdminSite" [disabled]="isRecoverTicket || isAbnormalBet">
          <option *ngFor="let item of selectionItem" [ngValue]="item.value">{{item.name}}</option>
        </select>
      </div>
    </div>
    <div class="col-sm-3">
      <div class="d-flex" [ngClass]="{'blur-content' : isRecoverTicket}">
        <label class="col-form-label">IsInsertedVoidedTransaction</label>
        <select [(ngModel)]="tmpModel.isInsertedVoidedTransaction" [disabled]="isRecoverTicket">
          <option *ngFor="let item of selectionItem" [ngValue]="item.value">{{item.name}}</option>
        </select>
      </div>
    </div>
    <div class="col-sm-3">
      <div class="d-flex" [ngClass]="{'blur-content' : !isRecoverTicket}">
        <label class="col-form-label">IsDeletedZzzBetTrans</label>
        <select [(ngModel)]="tmpModel.isDeletedZzzBetTrans" [disabled]="!isRecoverTicket">
          <option *ngFor="let item of selectionItem" [ngValue]="item.value">{{item.name}}</option>
        </select>
      </div>
    </div>
    <div class="col-sm-3">
      <div class="d-flex" [ngClass]="{'blur-content' : !isRecoverTicket}">
        <label class="col-form-label">IsDeletedMessage</label>
        <select [(ngModel)]="tmpModel.isDeletedMessage" [disabled]="!isRecoverTicket">
          <option *ngFor="let item of selectionItem" [ngValue]="item.value">{{item.name}}</option>
        </select>
      </div>
    </div>
    <div class="col-sm-3">
      <div class="d-flex" [ngClass]="{'blur-content' : !isRecoverTicket}">
        <label class="col-form-label">IsDeletedVoidedTransaction </label>
        <select [(ngModel)]="tmpModel.isDeletedVoidedTransaction" [disabled]="!isRecoverTicket">
          <option *ngFor="let item of selectionItem" [ngValue]="item.value">{{item.name}}</option>
        </select>
      </div>
    </div>
    <div class="col-sm-3">
      <div class="d-flex">
        <label class="col-form-label">IsUpdatedVoidingHistory</label>
        <select [(ngModel)]="tmpModel.isUpdatedVoidingHistory">
          <option *ngFor="let item of selectionItem" [ngValue]="item.value">{{item.name}}</option>
        </select>
      </div>
    </div>
    <div class="col-sm-3">
      <div class="d-flex">
        <label class="col-form-label">IsSentEmail</label>
        <select [(ngModel)]="tmpModel.isSentEmail">
          <option *ngFor="let item of selectionItem" [ngValue]="item.value">{{item.name}}</option>
        </select>
      </div>
    </div>
    <div class="col-sm-3">
      <div class="d-flex">
        <label class="col-form-label">JackTimeCashOutApi</label>
        <select [(ngModel)]="tmpModel.isRunExternalService">
          <option *ngFor="let item of selectionItem" [ngValue]="item.value">{{item.name}}</option>
        </select>
      </div>
    </div>
  </div>
  <div class="save-history-status mg-top-10">
    <input type="button" class="btn btn-primary btn-sm font-weight-bold" value="Save"
      (click)="confirmUpdateAfterVoidData()" />
  </div>
</div>
