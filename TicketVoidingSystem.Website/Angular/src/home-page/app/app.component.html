<menu-bar></menu-bar>
<div class="issue-type-hub">
  <div class="subtitle">
    <i class="fas fa-fire"></i>
    Issue Types ({{ currentMonth }})
  </div>
  <hr class="blue-line" />
  <div class="issue-type-grid" [blockUi]="isLoading">
    @for (issueType of issueTypes; track issueType) {
    <div class="issue-type-card" (click)="openIssueType(issueType)" title="{{ issueType.issueTypeName }}">
      <div class="card-icon">
        <i [class]="issueType.icon"></i>
      </div>
      <div class="card-content">
        <h3>{{ issueType.issueTypeName }}</h3>
        <span class="badge rounded-pill">
          @if (issueType.totalRequest === null) {
            <i class="fas fa-spinner fa-spin"></i>
          }
          {{ issueType.totalRequest !== null ? issueType.totalRequest : '' }} requests
        </span>
      </div>
    </div>
    }
  </div>
</div>
