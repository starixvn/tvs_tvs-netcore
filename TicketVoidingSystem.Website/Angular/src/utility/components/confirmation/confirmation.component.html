<fieldset class="confirm-delete">
  <legend>Confirmation</legend>
  <table>
    <tr>
      <td>
        <label for="reason">Reason (EN)</label>
      </td>
      <td>
        <textarea maxlength="150" class="reason form-control form-control-sm" [(ngModel)]="confirmation.reason"
          rows="1"></textarea>
      </td>
      <td>
        <span class="required">&nbsp;&nbsp;(*)</span> <span>Max {{150 - confirmation.reason.length}} characters</span>
      </td>
    </tr>
    <tr>
      <td>
        <label for="reasonSC">Reason (SC)</label>
      </td>
      <td>
        <textarea maxlength="150" class="reasonSC form-control form-control-sm" [(ngModel)]="confirmation.reasonSC"
          rows="1"></textarea>
      </td>
      <td>
        <span class="required">&nbsp;&nbsp;(*)</span> <span>Max {{150 - confirmation.reasonSC.length}} characters</span>
      </td>
    </tr>
    <tr>
      <td>
        <label>Username</label>
      </td>
      <td>
        <input class="form-control form-control-sm" type="text" disabled value="{{confirmation.userName}}" />
      </td>
      <td></td>
    </tr>
    <tr>
      <td>
        <label>Password</label>
      </td>
      <td>
        <input autocomplete="new-password" type="password" class="password form-control form-control-sm"
          [(ngModel)]="confirmation.userPassword" />
      </td>
      <td><span>&nbsp;&nbsp;(*)</span></td>
    </tr>
    <tr>
      <td></td>
      <td> 
        <input [disabled]="isDisabledButton" type="button" class="btn btn-success btn-sm font-weight-bold"
          value="Void All" (click)="voidAllPage()" />
      </td>
    </tr>
  </table>
</fieldset>
<tooltip [tooltip]="tooltip"></tooltip>
