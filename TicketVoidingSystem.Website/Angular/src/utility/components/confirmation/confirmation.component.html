@if (isShowConfirm) {
<fieldset class="confirm-delete">
  <legend>Confirmation</legend>
  <form id="confirmationForm">
    <table>
      <tr>
        <td>
          <label for="reason">Reason (EN)</label>
        </td>
        <td>
          <textarea maxlength="150" class="reason form-control form-control-sm" [(ngModel)]="confirmation.reason"
            name="reason"></textarea>
        </td>
        <td>
          <span class="required">&nbsp;&nbsp;(*) </span> <span>Max {{150 - confirmation.reason.length}}
            characters</span>
        </td>
      </tr>
      <tr>
        <td>
          <label for="reasonSC">Reason (SC)</label>
        </td>
        <td>
          <textarea maxlength="150" class="reasonSC form-control form-control-sm" [(ngModel)]="confirmation.reasonSC"
            name="reasonSC"></textarea>
        </td>
        <td>
          <span class="required">&nbsp;&nbsp;(*) </span> <span>Max {{150 - confirmation.reasonSC.length}}
            characters</span>
        </td>
      </tr>
      <tr>
        <td>
          <label>Username</label>
        </td>
        <td>
          <input type="text" class="form-control form-control-sm" disabled value="{{confirmation.userName}}"
            autocomplete="username" />
        </td>
        <td></td>
      </tr>
      <tr>
        <td>
          <label>Password</label>
        </td>
        <td class="d-flex">
          <input type="password" class="password form-control form-control-sm" [(ngModel)]="confirmation.userPassword"
            name="password" autocomplete="new-password" />
          <span class="required">&nbsp;&nbsp;(*)</span>
        </td>
      </tr>
      <tr>
        <td></td>
        <td>
          <input type="button" class="void-bet btn btn-primary btn-sm mg-right-10 font-weight-bold" value="Void Bet"
            (click)="voidBet()" />
        </td>
      </tr>
    </table>
  </form>
</fieldset>
}
<tooltip [tooltip]="tooltip"></tooltip>
