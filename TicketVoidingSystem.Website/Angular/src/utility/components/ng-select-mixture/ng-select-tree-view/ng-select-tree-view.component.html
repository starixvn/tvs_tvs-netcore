<div class="ng-select-tree-view">
  @for (item of items; track item) {
  <div>
    @if (!isHaveCheckBox(item)) {
    <div class="ng-select-tree-view-item" [ngClass]="{'item-selected': item.checked, 'cursor-not-allowed': isDisabled}"
      [style.padding-left]="paddingLeft+'px'" (click)="!isDisabled && handleClickSingleItem(item)">
      <label [ngClass]="{'cursor-not-allowed': isDisabled}">{{ item.name }}</label>
    </div>
    }
    @if (isHaveCheckBox(item)) {
    <div class="ng-select-tree-view-item" [ngClass]="{'item-selected': item.checked, 'cursor-not-allowed': isDisabled}"
      [style.padding-left]="paddingLeft+'px'">
      @if (item.items.length > 0) {
      <i class="fa" (click)="item.expanded = !item.expanded"
        [ngClass]="{'fa-angle-up': item.expanded, 'fa-angle-down': !item.expanded}" aria-hidden="true"></i>
      }
      <label [ngClass]="{'cursor-not-allowed': isDisabled}">
        <input type="checkbox" [(ngModel)]="item.checked" [ngClass]="{'cursor-not-allowed': isDisabled}" class="me-1"
          (ngModelChange)="item.checkChilds();handleClickChildItem()" [disabled]="!item.enabled || isDisabled" />
        {{ item.name }}
      </label>
    </div>
    }
    @if (item.expanded) {
    <div (click)="$event.stopPropagation()">
      <ng-select-tree-view [isDisabled]="isDisabled" [items]="item.items"
        (emitChildEvent)="checkFromChildEvent(item); handleClickChildItem()" [paddingLeft]="paddingLeft+25">
      </ng-select-tree-view>
    </div>
    }
  </div>
  }
</div>
