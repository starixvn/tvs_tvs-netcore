<div class="message-handler" *ngIf="isShowMessages">
  <ng-container *ngIf="isShowDynamicInputs()">
    <div class="input-text" *ngFor="let item of selectedTemplated.inputTexts">
      <div>
        <label>{{item.msgEnglish}}</label>
        <input type="text" class="form-control form-control-sm" [(ngModel)]="item.msgEnglishValue" (ngModelChange)="setChineseInput(item);updateMessage()">
      </div>
      <div [hidden]="item.hideChinese">
        <label>{{item.msgChineseTraditional}}</label>
        <input type="text" class="form-control form-control-sm" [(ngModel)]="item.msgChineseTraditionalValue" (ngModelChange)="updateMessage()">
      </div>
      <div [hidden]="item.hideChinese">
        <label>{{item.msgChineseSimplified}}</label>
        <input type="text" class="form-control form-control-sm" [(ngModel)]="item.msgChineseSimplifiedValue" (ngModelChange)="updateMessage()">
      </div>
      <div [hidden]="item.hideChinese">
        <label>{{item.msgChineseNewSimplified}}</label>
        <input type="text" class="form-control form-control-sm" [(ngModel)]="item.msgChineseNewSimplifiedValue" (ngModelChange)="updateMessage()">
      </div>
      <div>
        <label class="margin-top-30">{{item.pattern}}</label>
      </div>
    </div>
  </ng-container>
</div>

<div class="d-flex mg-left-10 mb-2">
  <div class="d-flex align-items-center mr-3" *ngIf="isShowAioCheckBoxMessage()">
    <input [(ngModel)]="value.checkAIOMessage" type="checkbox" id="chk-aio-msg" class="mr-1" (ngModelChange)="updateMessage()"/>
    <label class="col-form-label col-form-label-sm" for="chk-aio-msg"> AIO Message</label>
  </div>
  <div class="d-flex align-items-center mr-3" *ngIf="isShowEarlyEventCheckBoxMessage()">
    <input [(ngModel)]="value.isCheckedEarlyEvent" [disabled]="isDisabledCheckBoxEarlyEvent()" type="checkbox" id="chk-early-event" class="mr-1" (ngModelChange)="updateMessage()"/>
    <label class="col-form-label col-form-label-sm" for="chk-early-event"> Early Event</label>
  </div>
  <div class="d-flex align-items-center" *ngIf="isShowCheckBoxSpecialBetType()">
    <input [(ngModel)]="value.isCheckedSpecialBetType" type="checkbox" id="chk-special-bet-type" class="mr-1" (ngModelChange)="updateMessage()"/>
    <label class="col-form-label col-form-label-sm" for="chk-special-bet-type"> Special Bet type</label>
  </div>
</div>

<div class="message">
  <messages #messages [isShowMessages]="isShowMessages" [(message)]="message"></messages>
</div>
