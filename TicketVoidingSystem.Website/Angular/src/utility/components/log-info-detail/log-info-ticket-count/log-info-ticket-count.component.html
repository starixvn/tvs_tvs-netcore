<div *ngIf="model">
  Void time: <strong>{{displayFullDateTimeFormat(model.voidFromTime)}} - {{displayFullDateTimeFormat(model.voidToTime)}}</strong><br />
  Affected Single Count: <strong>{{model.singleCount}}</strong>
  <span *ngIf="isShowCountInfo(model.cashOutCount, model.settleCount, model.instantlySettleCount)" class="text-red"
  [innerHTML]="countInfoContent(model.cashOutCount, model.settleCount, model.instantlySettleCount) | sanitizeHtml"></span>,
  Parlay Count: <strong>{{model.mainParlayCount}} </strong>
  <span *ngIf="isShowDetailsButton" class="detail-tickets" (click)="showAffectedTicketsDetails()">Details</span><br />
  <span *ngIf="isShowCancelCashOut && model.cancelCashOutCount > 0">Cancel Cash Out: <strong>{{model.cancelCashOutCount}}</strong></span>
</div>
