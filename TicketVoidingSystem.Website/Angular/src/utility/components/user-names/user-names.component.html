<div class="no-gutters" [ngClass]="usernameComponentCss">
    <div class="col-form-label">Username(s)</div>
    <div class="col-12 col-sm-8" [ngClass]="inputUsernameCss" [ngStyle]="inputUsernameStyle">
        <div #usernames class="input-username" [ngClass]="{'point-event-none disabled-input': disabled}"
            (click)="focusUsername()" (mousedown)="$event.preventDefault()">
            <div *ngIf="groupUsername.items.length > 0">
                <div *ngFor="let item of groupUsername.items">
                    <div class="item-username" [ngClass]="item.cssClass">
                        <ng-container *ngIf="item.isShowTooltip">
                            <span ngbTooltip="{{item.tooltipText}}"
                                tooltipClass="invalid-item-toolTip">{{item.value}}</span>
                        </ng-container>
                        <ng-container *ngIf="!item.isShowTooltip">
                            <span>{{item.value}}</span>
                        </ng-container>
                        <span class="icon-delete" (click)="deleteItem(item)">&nbsp;</span>
                    </div>
                </div>
            </div>
            <input #input class="username" type="text" [(ngModel)]="username" (keydown)="onKey($event)"
                (blur)="addItem(username, false)" (paste)="pasteItem($event)" (keyup.shift)="shiftKey=false"
                (keydown.shift)="shiftKey=true" maxlength="30"/>
        </div>
        <span class="invalid-data"></span>
        <div class="flex-between" *ngIf="!isAbException">
            <span class="note note-invalid-username">(*) Invalid Username(s) are highlighted in RED.
                <span class="note note-moved-username mg-left-5">(*) Duplicated Usernames are highlighted in ORANGE.</span>
            </span>
            <span class="red">Max: SMA = 50 / Member = 2000</span>
        </div>
        <div class="flex-between" *ngIf="isAbException">
            <span>
                <span class="note note-invalid-username">(*) Invalid Username </span>
                <span class="note note-moved-username">(*) Duplicated Username</span>
                <span class="note note-existed-username">(*) Existed Username</span>
            </span>

            <span class="red">Max: {{maxUsername}} Usernames</span>
        </div>
    </div>
</div>

<tooltip [tooltip]="tooltip"></tooltip>
