<div class="group-licensee area-filter">
  <table>
    <thead>
      <tr>
        <th scope="col" colspan="2">
          <label>
            <input class="check-group-licensee" type="checkbox" [(ngModel)]="model.isChecked" [disabled]="disabled"
              (ngModelChange)="model.changeCheckAllLicensee();changeLicensees()" />
            All Licensees
          </label>
        </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let group of model.groupLicensees">
        <td>
          <span [ngClass]="{'icon-collapse':group.isCollapse, 'icon-expand':!group.isCollapse}"
            (click)="group.isCollapse = !group.isCollapse"></span>
          <label>
            <input type="checkbox" [(ngModel)]="group.isChecked" [disabled]="disabled"
              (ngModelChange)="group.checkedGroup(); model.changeCheckGroupToModel();changeLicensees()" />
            {{group.groupName}}
          </label>
        </td>
        <td>
          <div class="licensee-in-group" [ngClass]="{'hide':group.isCollapse}">
            <div class="licensee" *ngFor="let licensee of group.licensees">
              <label>
                <input type="checkbox" [(ngModel)]="licensee.isChecked" [disabled]="disabled"
                  (ngModelChange)="group.checkedLicensee(); model.changeCheckGroupToModel();changeLicensees()" />
                {{licensee.name}}
              </label>
            </div>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
