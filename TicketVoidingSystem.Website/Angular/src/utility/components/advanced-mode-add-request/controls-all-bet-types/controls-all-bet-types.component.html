<div [hidden]="!isShowContent()"  class="all-bet-types bet-team">
    <div class="bet-team-1 d-flex">
      <div class="left"><b>All bet types: </b></div>
      <div class="right">
        <div *ngFor="let item of controlsAllBetTypesLists">
          <div *ngIf="item.isShow" class="dropdown-item-adv">
            <span class="mr-1"><b>{{item.type}}: </b></span>
            <multiple-select class="multiple-selection" [multipleSelect]="item.items"
              (checkedItems)="updateByControlAllBetType($event, item.type)">
            </multiple-select>
          </div>
        </div>
      </div>
    </div>
  </div>
