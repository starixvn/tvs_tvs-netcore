<div class="advanced-mode" *ngIf="isShowAdvancedModeFilter">
  <div class="advanced-mode-header" (click)="isShowContent = !isShowContent"
    [attr.aria-expanded]="!isShowContent">
    <strong>Advanced Mode</strong>
  </div>
  <div class="advanced-mode-body" #collapse="ngbCollapse" [(ngbCollapse)]="isShowContent">
    <div *ngFor="let betTeam of betTeams">
      <div [ngSwitch]="betTeam.type" *ngIf="betTeam.isChecked">
        <div *ngSwitchCase="1" class="bet-team">
          <div class="bet-team-1">
            <div class="left mg-right-10">
              {{betTeam.name}}
            </div>
            <div class="right">
              <ng-container *ngFor="let selection of betTeam.selections">
                <div class="dropdown-item-adv" *ngIf="!selection.isMultiple">
                  <span class="mr-1" *ngIf="selection.name !== ''">{{selection.name}}</span>
                  <select [(ngModel)]="selection.value" (ngModelChange)="changeFilter()"
                    class="bet-team-{{betTeam.index}}-selection-{{selection.index}}">
                    <option *ngFor="let item of selection.items" [attr.value]="item.value">{{item.name}}</option>
                  </select>
                </div>
                <div class="dropdown-item-adv" *ngIf="selection.isMultiple">
                  <span class="mr-1">{{selection.multiSelection.name}}</span>
                  <multiple-select class="multiple-selection bet-team-{{betTeam.index}}-selection-{{selection.index}}"
                    [multipleSelect]="selection.multiSelection.multipleSelect" (checkedItems)="changeFilter()">
                  </multiple-select>
                </div>
              </ng-container>
              <div class="d-flex" *ngIf="betTeam.inputs?.length > 0">
                <div class="input-item-adv" *ngFor="let item of betTeam.inputs">
                  <span class="mr-1">{{item.name}}</span>
                  <input class="bet-team-{{betTeam.index}}-input-{{item.index}}" type="text" [(ngModel)]="item.value"
                    [disabled]="item.isDisabled"
                    (ngModelChange)="onChangeInputMultipleDecimal(betTeam.betTypes,
                      betTeam.index, item.index, item.isMultiple, $event); changeFilter()"
                    triggers="manual" multipleDecimal />
                </div>
                <div>
                  Ex: 0.75&1
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<tooltip [tooltip]="tooltip"></tooltip>
