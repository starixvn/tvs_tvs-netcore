<div class="group-bettypes area-filter" *ngIf="model.groupBetTypes.length > 0">
  <table>
    <thead>
      <tr>
        <th scope="col" colspan="2">
          <div>
            <label>
              <input type="checkbox" class="group-bettypes-all-checkbox me-1" [(ngModel)]="model.isChecked"
              [disabled]="model.isDisable"
              (ngModelChange)="model.changeCheckedModelToGroup(); changeAllBetTypes()" />
              All Bet types
            </label>
          </div>
        </th>
      </tr>
    </thead>
    <tbody class="scroller-firefox" [ngClass]="{'collapse': collapse && scroll}">
      <tr *ngFor="let group of model.groupBetTypes; last as isLast;" [ngClass]="{'last-group' : isLast}">
        <td *ngIf="group.isShow && group.betTypes.length > 0">
          <label>
            <input class="me-1" type="checkbox" [(ngModel)]="group.isChecked"
            (ngModelChange)="group.changeCheckedGroupToBetType(); model.changeCheckedGroupToModel();changeGroupBetTypes(group)"
              [disabled]="group.isDisable"/>
            {{group.groupName}}
          </label>
        </td>
        <td *ngIf="group.isShow">
          <div class="display-flex">
            <div class="bet-type" *ngFor="let betType of group.betTypes">
              <label>
                <input class="me-1" type="checkbox" [(ngModel)]="betType.isChecked" [disabled]="betType.isDisable"
                (ngModelChange)="group.changeCheckedBetTypeToGroup(); model.changeCheckedGroupToModel(); changeBetTypeItem(betType)" />
                {{betType.name}}
              </label>
            </div>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<tooltip [tooltip]="tooltip"></tooltip>
