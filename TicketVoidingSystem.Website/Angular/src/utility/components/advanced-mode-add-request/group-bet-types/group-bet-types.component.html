@if (model.groupBetTypes.length > 0) {
<div class="group-bettypes area-filter">
  <table>
    <thead>
      <tr>
        <th scope="col" colspan="2">
          <div>
            <label>
              <input type="checkbox" class="group-bettypes-all-checkbox me-1" [(ngModel)]="model.isChecked"
                [disabled]="model.isDisable" (ngModelChange)="changeCheckedModelToGroup(); changeAllBetTypes()" />
              All Bet types
            </label>
          </div>
        </th>
      </tr>
    </thead>
    <tbody class="scroller-firefox" [ngClass]="{'collapse': collapse && scroll}">
      @for (group of model.groupBetTypes; track group; let isLast = $last) {
      <tr [ngClass]="{'last-group' : isLast}">
        @if (group.isShow && group.betTypes.length > 0) {
        <td>
          <label>
            <input class="me-1" type="checkbox" [(ngModel)]="group.isChecked"
              (ngModelChange)="changeCheckedGroupToBetType(group); changeCheckedGroupToModel();changeGroupBetTypes(group)"
              [disabled]="group.isDisable" />
            {{group.groupName}}
          </label>
        </td>
        }
        @if (group.isShow) {
        <td>
          <div class="display-flex">
            @for (betType of group.betTypes; track betType) {
            <div class="bet-type">
              <label>
                <input class="me-1" type="checkbox" [(ngModel)]="betType.isChecked" [disabled]="betType.isDisable"
                  (ngModelChange)="changeCheckedBetTypeToGroup(group); changeCheckedGroupToModel(); changeBetTypeItem(betType)" />
                {{betType.name}}
              </label>
            </div>
            }
          </div>
        </td>
        }
      </tr>
      }
    </tbody>
  </table>
</div>
}
<tooltip [tooltip]="tooltip"></tooltip>
