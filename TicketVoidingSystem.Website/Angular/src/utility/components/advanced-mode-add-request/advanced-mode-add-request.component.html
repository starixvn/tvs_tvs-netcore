<div class="advaced-mode-body">
  <group-bet-types #groupBetTypesComponent
    (checkExistBetTypeEvent)="handleNoBetTypeEvent($event)"
    [model]="groupBetTypes"
    (betTypesEvent)="changeBetTypes($event)">
  </group-bet-types>
  <advanced-mode #advancedMode
    [advancedModeAddRequestModel]="model"
    [matchId]="matchId" [allBetTypes]="allBetTypes"
    [isShowAdvancedModeFilter]="isShowAdvancedModeFilter" >
  </advanced-mode>
</div>
