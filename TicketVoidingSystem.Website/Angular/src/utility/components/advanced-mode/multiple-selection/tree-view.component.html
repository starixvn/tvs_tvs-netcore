<ul class="multiple-select">
    <li *ngFor="let item of items">
        <div class="multiple-select-item">
            <i *ngIf="item.items.length > 0" class="mr-1 fa" [ngClass]="{'fa-angle-up': item.expanded, 'fa-angle-down': !item.expanded}"
               (click)="item.expanded = !item.expanded"></i>
            <label [ngClass]="{'margin-left-13': item.items.length == 0}">
                <input type="checkbox" [(ngModel)]="item.checked" 
                       (ngModelChange)="item.checkChilds();clickEvent(item)" 
                       [disabled]="!item.enable"  (keyup.shift)="keyUp()" (keydown.shift)="keyDown()" />
                {{ item.text }}
            </label>
        </div>
        <div *ngIf="item.expanded">
            <tree-view [items]="item.items"></tree-view>
        </div>
    </li>
</ul>
