<div class="multiple-selection" [style.width]="multipleSelect.maxWidth">
    <button class="button" type="button" readonly (click)="dropdownToggle = !dropdownToggle">
        <div [ngClass]="{'place-holder': multipleSelect.isShowPlaceHolder}">{{multipleSelect.selectionTitle }}</div>
        <i class="fa fa-angle-down"></i>
    </button>
    <div class="show-tree-view" *ngIf="multipleSelect.items != undefined && dropdownToggle">
        <div class="dropdown-header" *ngIf="multipleSelect.showHeader">
            <label class="d-flex">
                <input class="mr-1" type="checkbox" [(ngModel)]="multipleSelect.isCheckAll" [disabled]="multipleSelect.isDisabled"
                    (ngModelChange)="multipleSelect.checkAllItems(multipleSelect.isCheckAll);changeItems();" />
                {{multipleSelect.checkAllCheckBoxText}}
            </label>
            <i class="fa" [ngClass]="{'fa-angle-up': expanded, 'fa-angle-down': !expanded}" (click)="toggle()"></i>
        </div>
        <div class="tree-view-content" [style.max-height]="multipleSelect.maxHeight">
            <tree-view [items]="multipleSelect.items" (change)="changeItems()"></tree-view>
        </div>
    </div>
</div>
