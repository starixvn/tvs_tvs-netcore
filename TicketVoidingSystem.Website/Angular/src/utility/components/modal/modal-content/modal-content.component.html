<div class="modal-header" [ngClass]="{'danger': data.type == 0, 'success': data.type == 1, 'warning': data.type == 2,
            'primary': data.type == 3 || data.type == 4}">
  <label class="modal-title">{{data.title}}</label>
  <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="dismissClick()"></button>
</div>
<div class="modal-body">
  @if (!data.copyContent) {
  <div [innerHtml]="data.message | sanitizeHtml"></div>
  }
  @if (data.copyContent) {
  <div>
    @for (item of data.content; track item) {
    <p class="m-0"><b>{{item.title}}</b></p>
    <p class="m-0 cursor-pointer" ngxClipboard [cbContent]="item.message" (click)="copiedContent()">{{item.message}}</p>
    }
  </div>
  }
</div>
@if (data.type == 3) {
<div class="modal-footer">
  <button type="button" class="btn confirm" (click)="confirmClickOk()" [disabled]="isProcessingOkCallback">Ok</button>
  <button type="button" class="btn cancel" (click)="closeClick()">Cancel</button>
</div>
}

@if (data.type == 4) {
<div class="modal-footer">
  <button type="button" class="btn confirm" (click)="confirmClickYes()"
    [disabled]="isProcessingYesCallback">Yes</button>
  <button type="button" class="btn confirm" (click)="confirmClickNo()">No</button>
  <button type="button" class="btn cancel" (click)="closeClick()">Cancel</button>
</div>
}
