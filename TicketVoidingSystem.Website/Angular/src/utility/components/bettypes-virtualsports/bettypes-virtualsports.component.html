<div class="bettypes" *ngIf="product === 5 && groups != undefined && display">
    <div *ngFor="let group of groups">
        <div class="header" *ngIf="group.display">
            <label>
                <input type="checkbox" class="checkbox-all-bettypes" [(ngModel)]="group.checked" (ngModelChange)="group.changeAll()" />
                All Bet types
            </label>
        </div>
        <div class="content" *ngIf="group.display">
            <ng-container *ngFor="let bettype of group.betTypes">
                <label>
                    <input type="checkbox" [(ngModel)]="bettype.checked" (ngModelChange)="group.changedItem()" />
                    {{bettype.name}}
                </label>
            </ng-container>
        </div>
    </div>
</div>
<tooltip [tooltip]="tooltip"></tooltip>
