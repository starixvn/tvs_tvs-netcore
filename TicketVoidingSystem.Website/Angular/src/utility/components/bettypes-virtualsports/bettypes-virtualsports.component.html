@if (isShowCheckedBetTypes()) {
  <div class="bettypes">
    <div class="header">
      <label>
        <input type="checkbox" class="checkbox-all-bettypes" [(ngModel)]="group.checked" (ngModelChange)="changeAll()" />
        All Bet types
      </label>
    </div>
    <div class="content">
      @for (bettype of group.betTypes; track bettype) {
        <label>
          <input type="checkbox" [(ngModel)]="bettype.checked" />
          {{bettype.name}}
        </label>
      }
    </div>
  </div>
}
<tooltip [tooltip]="tooltip"></tooltip>
