<div class="bettypes" *ngIf="isShowCheckedBetTypes()">
    <div class="header">
        <label>
            <input type="checkbox" class="checkbox-all-bettypes" [(ngModel)]="group.checked" (ngModelChange)="group.changeAll()" />
            All Bet types
        </label>
    </div>
    <div class="content">
        <ng-container *ngFor="let bettype of group.betTypes">
            <label>
                <input type="checkbox" [(ngModel)]="bettype.checked" />
                {{bettype.name}}
            </label>
        </ng-container>
    </div>
</div>
<tooltip [tooltip]="tooltip"></tooltip>
