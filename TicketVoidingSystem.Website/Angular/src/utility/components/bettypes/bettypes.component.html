@if (model!= undefined && model.betTypes.length > 0 && display) {
  <div class="bettypes">
    <div class="header">
      <label>
        <input type="checkbox" class="checkbox-all-bettypes" [(ngModel)]="model.isChecked" (ngModelChange)="model.changeAll()" [disabled]="isDisabledAllBetTypes"/>
        All Bet types
      </label>
    </div>
    <div class="content">
      @for (bettype of model.betTypes; track bettype) {
        @if (bettype.isShow) {
          <label>
            <input type="checkbox" [(ngModel)]="bettype.isChecked" (ngModelChange)="model.changeItem()" [disabled]="isDisabledAllBetTypes"/>
            {{bettype.name}}
          </label>
        }
      }
    </div>
  </div>
}
<tooltip [tooltip]="tooltip"></tooltip>
