<div class="date-time">
  <div class="input-group">
    <input class="form-control form-control-sm bg-white" placeholder="yyyy-mm-dd" name="dp" [(ngModel)]="model.ngbDate"
      (ngModelChange)="updateModel()" ngbDatepicker #d="ngbDatepicker" (click)="d.toggle()" [disabled]="disabled" [readOnly]="true">
    <div class="input-group-append pointer">
      <span class="input-group-text" (click)="d.toggle()"><em class="fa fa-calendar"></em></span>
    </div>
  </div>
  <div class="time" [ngClass]="{'disabled':disabled}">
    <input type="text" maxlength="2" min="0" max="23" class="hour" [(ngModel)]="model.hour" time-control
      (keydown)="model.eventHour($event);updateModel()" [disabled]="disabled" />
    <span>:</span>
    <input type="text" maxlength="2" min="0" max="59" class="minute" [(ngModel)]="model.minute" time-control
      (keydown)="model.eventMinute($event);updateModel()" [disabled]="disabled" />
    <span>:</span>
    <input type="text" maxlength="2" min="0" max="59" class="second" [(ngModel)]="model.second" time-control
      (keydown)="model.eventSecond($event);updateModel()" [disabled]="disabled" />
  </div>
</div>
