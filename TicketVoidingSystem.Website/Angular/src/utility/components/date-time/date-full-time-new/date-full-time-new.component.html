<div class="full-time d-flex">
  <date-picker [index]="index" [disabled]="isDisabled" [maxDate]="maxDate" [minDate]="minDate" [readonly]="readonly"
    [(ngModel)]="date" (ngModelChange)="onChangeModel()" class="me-2">
  </date-picker>
  <div class="time-filter">
    <input type="text" class="form-control form-control-sm time-input{{index}} {{timeClass}}"
      [style.width.px]="withOfTime" [(ngModel)]="time" placeholder="HH:mm:ss.SSS AM/PM"
      (ngModelChange)="onChangeTime($event)" [disabled]="isDisabled" (paste)="onPasteTime()"
      (blur)="onBlur();onChangeModel()" />
  </div>
</div>
<tooltip [tooltip]="tooltip"></tooltip>
