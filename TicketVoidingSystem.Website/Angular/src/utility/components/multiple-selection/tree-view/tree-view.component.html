<ul class="multiple-select">
  <li *ngFor="let item of items">
      <div class="multiple-select-item"
        [ngClass]="{'margin-left-13': item.items.length === 0, 'item-selected': item.checked, 'cursor-not-allowed': isDisabled }">
          <i *ngIf="item.items.length > 0" class="fa" [ngClass]="{'fa-angle-up': item.expanded, 'fa-angle-down': !item.expanded}"
             (click)="item.expanded = !item.expanded"></i>
          <label [ngClass]="{'cursor-not-allowed': isDisabled}">
              <input type="checkbox" [(ngModel)]="item.checked" class="mr-1" [ngClass]="{'cursor-not-allowed': isDisabled}"
                     (ngModelChange)="item.checkChilds();handleClick(item)" 
                     [disabled]="!item.enable || isDisabled" (keyup.shift)="keyUpEvent()" (keydown.shift)="keyDownEvent()" />
              {{ item.text }}
          </label>
      </div>
      <div *ngIf="item.expanded">
          <tree-view [items]="item.items" [isDisabled]="isDisabled"></tree-view>
      </div>
  </li>
</ul>
