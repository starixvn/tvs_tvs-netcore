<div class="paging d-flex justify-content-between bg-light">
  <div class="d-flex justify-content-start">
    <label class="text-nowrap text-primary"><strong>Page size</strong></label>
    <select class="selection form-control form-control-sm" [(ngModel)]="model.pageSize" (change)="changePageSize()">
      <option *ngFor="let item of model.selection" [attr.value]="item">{{item}}</option>
    </select>
    <ngb-pagination [collectionSize]="model.total" [(page)]="model.page" [pageSize]="model.pageSize" [maxSize]="5"
      [rotate]="true" [boundaryLinks]="true" (pageChange)="pageChange()" size="sm"></ngb-pagination>
  </div>

  <div>
    <label>Displaying <strong>{{model.begin}}</strong> to <strong>{{model.end}}</strong> of <strong>{{model.total}}</strong> item(s)</label>
  </div>
</div>
