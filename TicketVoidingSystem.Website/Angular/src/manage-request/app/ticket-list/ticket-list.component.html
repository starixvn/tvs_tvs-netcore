@if (modal.open) {
  <div>
    <div style="z-index: 1050" aria-hidden="true" class="modal-backdrop fade show"></div>
    <div role="dialog" class="fade modal show d-block">
      <div role="document" class="modal-dialog-custom modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <div class="modal-title">
              <strong>Void/Recover Bet Check (Request ID: {{modal.requestId}})</strong>
            </div>
            <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="modal.open = !modal.open"></button>
          </div>
          <div class="modal-body" [blockUi]="isBlock" >
            @if (isShowRequestInfo) {
              <request-info [model]="requestDetail" [issue]="issue" [ticketListModal]="modal"
              [tabInfoRequest]="modal.tabInfoRequest"></request-info>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
}
