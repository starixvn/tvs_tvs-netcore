module.exports = "<div class=\"title\">\r\n    Home / Void By Currency\r\n</div>\r\n\r\n<div id=\"body\">\r\n    <filter #filter\r\n            (searchEvent)=\"searchEvent($event)\"\r\n            (changeMatchEvent)=\"hideContent($event)\"></filter>\r\n    <match-detail [matchDetail]=\"matchDetail\"\r\n                  [isShowMatch]=\"isShowMatch\"></match-detail>\r\n    <tickets-result #ticketsResult\r\n                    [ticketsViewModel]=\"ticketsViewModel\"\r\n                    [isShowTickets]=\"isShowTickets\"\r\n                    (pagingSearchTicket)=\"pagingSearchTicket($event)\"\r\n                    (exportExcelEvent)=\"exportExcel($event)\"></tickets-result>\r\n    <span class=\"message-bettrade\"></span>\r\n    <messages #messages\r\n              [isShowMessages]=\"isShowMessages\"></messages>\r\n    <confirmation #confirmation\r\n                  [isShowConfirm]=\"isShowConfirm\"\r\n                  (voidEvent)=\"voidBet($event)\"></confirmation>\r\n</div>\r\n<modal [modal]=\"modal\" (confirmEvent)=\"confirmEvent()\"></modal>\r\n<notification [notification]=\"notification\"></notification>\r\n<checking-permission #checkingPermission [checkingPermissionModel]=\"checkingPermissionModel\" (allow)=\"voidTickets()\"\r\n    (deny)=\"notHavePermission()\"></checking-permission>\r\n<tooltip [tooltip]=\"tooltip\"></tooltip>\r\n<messages-result [messagesResult]=\"messagesResult\"></messages-result>\r\n\r\n<div *ngIf=\"blockUI\">\r\n    <div class=\"in modal-backdrop spinner-overlay\"></div>\r\n    <div class=\"spinner-message-container\" aria-live=\"assertive\" aria-atomic=\"true\">\r\n        <div class=\"loading-message\">\r\n            <div class=\"loading\"></div>\r\n        </div>\r\n    </div>\r\n</div>"
