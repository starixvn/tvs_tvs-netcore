<div class="title">
    {{title}}
</div>

<div id="body">
    <filter #filter
            (searchEvent)="searchEvent($event)"
            (changeMatchEvent)="hideContent($event)"></filter>
    <match-detail [matchDetail]="matchViewModel"
                  [isShowMatch]="isShowMatch"></match-detail>
    <tickets #ticket
             [ticketsModel]="ticketsModel"
             [isShowTickets]="isShowTickets"
             (pagingSearchTicket)="pagingSearchTicket($event)"
             (exportExcelEvent)="exportExcel($event)"></tickets>
    <messages #messages
              [isShowMessages]="isShowMessages"></messages>
    <confirmation #confirmation
                  [isShowConfirm]="isShowConfirm"
                  (voidEvent)="voidBet($event)"></confirmation>
</div>

<modal [modal]="modal" (confirmEvent)="confirmEvent()"></modal>
<notification [notification]="notification"></notification>
<tooltip [tooltip]="tooltip"></tooltip>
<messages-result [messagesResult]="messagesResult"></messages-result>
<div *ngIf="blockUI">
    <div class="in modal-backdrop spinner-overlay"></div>
    <div class="spinner-message-container" aria-live="assertive" aria-atomic="true">
        <div class="loading-message">
            <div class="loading"></div>
        </div>
    </div>
</div>
