<fieldset class="confirm-delete" *ngIf="isShowConfirm">
    <legend>Confirmation</legend>
    <table>
        <tr>
            <td>
                <label for="reason">Reason (EN)</label>
            </td>
            <td>
                <textarea maxlength="150" class="reason"
                          [(ngModel)]="confirmation.reason"></textarea>
            </td>
            <td>
                <span class="required">&nbsp;&nbsp;(*)</span> <span>Max {{150 - confirmation.reason.length}} characters</span>
            </td>
        </tr>
        <tr>
            <td>
                <label for="reasonSC">Reason (SC)</label>
            </td>
            <td>
                <textarea maxlength="150" class="reasonSC"
                          [(ngModel)]="confirmation.reasonSC"></textarea>
            </td>
            <td>
                <span class="required">&nbsp;&nbsp;(*)</span> <span>Max {{150 - confirmation.reasonSC.length}} characters</span>
            </td>
        </tr>
        <tr>
            <td>
                <label>Username</label>
            </td>
            <td>
                <input type="text" disabled value="{{confirmation.userName}}" />
            </td>
            <td></td>
        </tr>
        <tr>
            <td>
                <label>Password</label>
            </td>
            <td>
                <input autocomplete="new-password" type="password" class="password" [(ngModel)]="confirmation.userPassword" />
                <span>&nbsp;&nbsp;(*)</span>
            </td>
        </tr>
        <tr>
            <td></td>
            <td>
                <input type="button" class="void-bet" value="Void Bet" (click)="voidBet()" />
            </td>
        </tr>
    </table>
</fieldset>
<tooltip [tooltip]="tooltip"></tooltip>
