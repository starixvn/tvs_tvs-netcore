<div class="full-time">
    <form>
        <date-picker [showClearButton]="false" format="YYYY/MM/DD" [(ngModel)]="model.date" name="date" [disabled]="disabled"></date-picker>
    </form>
    <div class="time" [ngClass]="{'disabled':disabled}">
        <input type="text" maxlength="2" min="1" max="12" class="hour"
               [(ngModel)]="model.hour"
               full-time-control
               (keydown)="model.eventHour($event)"
               (paste)="eventPaste($event)"
               [disabled]="disabled" />
        <span>:</span>
        <input type="text" maxlength="2" min="0" max="59" class="minute"
               [(ngModel)]="model.minute"
               full-time-control
               (keydown)="model.eventMinute($event)"
               (paste)="eventPaste($event)"
               [disabled]="disabled" />
        <span>:</span>
        <input type="text" maxlength="2" min="0" max="59" class="second"
               [(ngModel)]="model.second"
               full-time-control
               (keydown)="model.eventSecond($event)"
               (paste)="eventPaste($event)"
               [disabled]="disabled" />
        <span>.</span>
        <input type="text" maxlength="3" min="0" max="999" class="millisecond"
               [(ngModel)]="model.millisecond"
               full-time-control
               (keydown)="model.eventMillisecond($event)"
               (paste)="eventPaste($event)"
               [disabled]="disabled" />
        <input type="text" maxlength="2" class="meridiem"
               [(ngModel)]="model.meridiem"
               full-time-control
               (keydown)="model.eventMeridiem($event)"
               (paste)="eventPaste($event)"
               [disabled]="disabled" />
    </div>
</div>
<tooltip [tooltip]="tooltip"></tooltip>
