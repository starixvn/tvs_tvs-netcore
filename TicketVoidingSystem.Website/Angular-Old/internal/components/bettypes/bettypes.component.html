<div class="bettypes" *ngIf="model!= undefined && model.betTypes.length > 0 && display">
    <div class="header">
        <label>
            <input type="checkbox" class="checkbox-all-bettypes" [(ngModel)]="model.isChecked" (ngModelChange)="model.changeAll()" />
            All Bet types
        </label>
    </div>
    <div class="content">
        <ng-container *ngFor="let betType of model.betTypes">
            <label *ngIf="betType.isShow">
                <input type="checkbox" [(ngModel)]="betType.isChecked" (ngModelChange)="model.changeItem()" />
                {{betType.name}}
            </label>
        </ng-container>
    </div>
</div>
<tooltip [tooltip]="tooltip"></tooltip>
